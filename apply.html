<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<script>
// 1. إعداد الاتصال (تأكد أن هذا الكود هو نفس الموجود في لوحة التحكم)
const firebaseConfig = {
    databaseURL: "https://myproject-7439e-default-rtdb.firebaseio.com/" 
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 2. دالة إرسال الطلب (المعدلة للعمل مع التصميم الجديد)
function processSubmission() {
    // جلب البيانات من الحقول
    const name = document.getElementById('fullName').value;
    const gId = document.getElementById('gameId').value;
    const age = document.getElementById('age').value;
    const dept = document.getElementById('deptSelect').value;

    if(!name || !gId) {
        alert("يرجى تعبئة الحقول الأساسية");
        return;
    }

    const orderId = 'KR-' + Math.floor(Math.random() * 100000);
    
    // البيانات التي ستصل للوحة التحكم
    const requestData = {
        id: orderId,
        fullName: name,
        gameId: gId,
        age: age,
        departmentName: dept, // هذا هو الحقل الذي تقرأه لوحة التحكم عادة
        status: 'pending',    // الحالة الافتراضية لتظهر في "الطلبات الجديدة"
        date: new Date().toLocaleString('ar-SA')
    };

    // الإرسال الفعلي
    db.ref('orders/' + orderId).set(requestData)
    .then(() => {
        alert("تم إرسال طلبك بنجاح! رقم الطلب: " + orderId);
        // يمكنك هنا توجيه المستخدم لصفحة الانتظار
    })
    .catch((error) => {
        console.error("خطأ في الإرسال:", error);
        alert("فشل الإرسال، تأكد من إعدادات Firebase");
    });
}
</script>
