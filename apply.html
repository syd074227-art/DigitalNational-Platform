    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<body>
    <!-- HTML الكود السابق نفسه -->
    
<script>
// ✅ تكوين Firebase - استخدم رابط قاعدة البيانات الذي أرسلته
const firebaseConfig = {
    databaseURL: "https://kr-system-5c846-default-rtdb.firebaseio.com/"
};

// ✅ تهيئة Firebase
let database;
try {
    const app = firebase.initializeApp(firebaseConfig);
    database = firebase.database();
    console.log('✅ Firebase جاهز للعمل');
} catch (error) {
    console.log('⚠️ Firebase غير مهيئ:', error);
    database = null;
}

const DEPARTMENTS = {
    health: { name: 'وزارة الصحة', color: '#2196f3', icon: 'fa-heartbeat', ranks: ['مسعف', 'مسعف أول', 'ممرض', 'ممرض أول', 'فني صحي', 'فني صحي أول', 'أخصائي', 'مساعد جراح', 'دكتور عام', 'دكتور', 'استشاري', 'جراح', 'رئيس استشاري', 'مدير طبي', 'مستشار وزير الصحة', 'نائب وزير الصحة', 'وزير الصحة'], additionals: ['إدارة القبول والتسجيل', 'إدارة الشؤون الصحية', 'مسؤول الشؤون الصحية', 'إدارة متطوعين الهلال الأحمر', 'إدارة الشكاوي بوزارة الصحة', 'إدارة الكلية الصحية'] },
    interior: { name: 'وزارة الداخلية', color: '#f44336', icon: 'fa-shield-alt', ranks: ['جندي', 'جندي أول', 'عريف', 'وكيل رقيب', 'رقيب', 'رقيب أول', 'رئيس رقباء', 'ملازم', 'ملازم أول', 'نقيب', 'رائد', 'مقدم', 'عقيد', 'عميد', 'لواء', 'فريق', 'فريق أول', 'نائب مدير الأمن العام', 'مدير الأمن العام', 'نائب وزير الداخلية', 'وزير الداخلية'], additionals: ['إدارة القبول والتجنيد', 'إدارة شؤون الداخلية', 'إدارة شؤون الأفراد سلك الضباط', 'الادارة العامة لوزارة الداخلية', 'ادارة الشكاوي بوزارة الداخلية'] },
    justice: { name: 'وزارة العدل', color: '#4caf50', icon: 'fa-gavel', ranks: ['محامي', 'محامي خبير', 'محامي متمرس', 'قاضي', 'قاضي متمرس', 'قاضي خبير', 'قاضي محكمة عليا', 'مستشار القضايا', 'مستشار وزير العدل', 'نائب وزير العدل', 'وزير العدل'], additionals: ['الاداره العامه للشؤون العدلية', 'ادارة القبول والتسجيل', 'ادارة الشكاوي بوزارة العدل'] },
    citizen: { name: 'مواطن', color: '#9c27b0', icon: 'fa-user', ranks: ['مواطن'], additionals: [] }
};

let selectedDepartment = null, selectedRank = null, selectedAdditionals = [], hasExistingRequest = false, existingRequestData = null, uploadedNationalId = null, uploadedCharacterImage = null, statusCheckInterval = null, firebaseListener = null;

document.addEventListener('DOMContentLoaded', function() {
    console.log('🚀 نظام تفعيل الهوية الرقمي - جاهز للعمل');
    checkExistingRequest();
    setupGameIdField();
});

// ✅ دالة التحقق من الطلبات الحالية
function checkExistingRequest() {
    const deviceId = getDeviceId();
    
    // ✅ 1. التحقق من Firebase أولاً
    if (database) {
        checkFirebaseStatus(deviceId)
            .then(firebaseStatus => {
                if (firebaseStatus.accepted) {
                    console.log('✅ تم قبول الطلب من Firebase! جاري التوجيه...');
                    handleAcceptedUser(firebaseStatus.userData);
                    return;
                }
                
                if (firebaseStatus.exists) {
                    console.log('📋 طلب موجود في Firebase:', firebaseStatus.status);
                    showFirebaseRequestStatus(firebaseStatus);
                    document.getElementById('loadingScreen').style.display = 'none';
                    
                    // ✅ بدء الاستماع للتحديثات من Firebase
                    startFirebaseListener(deviceId);
                    return;
                }
                
                // إذا لم يوجد في Firebase، تحقق من localStorage
                checkLocalStorageStatus(deviceId);
            })
            .catch(error => {
                console.log('⚠️ خطأ في الاتصال ب Firebase:', error);
                checkLocalStorageStatus(deviceId);
            });
    } else {
        checkLocalStorageStatus(deviceId);
    }
}

// ✅ دالة التحقق من Firebase
function checkFirebaseStatus(deviceId) {
    return new Promise((resolve, reject) => {
        const requestsRef = database.ref('requests');
        requestsRef.orderByChild('deviceId').equalTo(deviceId).once('value')
            .then(snapshot => {
                if (snapshot.exists()) {
                    let userData = null;
                    let status = 'pending';
                    let accepted = false;
                    let requestKey = null;
                    
                    snapshot.forEach(childSnapshot => {
                        const data = childSnapshot.val();
                        userData = data;
                        requestKey = childSnapshot.key;
                        status = data.status || 'pending';
                        if (status === 'accepted') {
                            accepted = true;
                        }
                    });
                    
                    resolve({
                        exists: true,
                        status: status,
                        accepted: accepted,
                        userData: userData,
                        requestKey: requestKey
                    });
                } else {
                    resolve({
                        exists: false,
                        status: 'none',
                        accepted: false,
                        userData: null,
                        requestKey: null
                    });
                }
            })
            .catch(error => {
                reject(error);
            });
    });
}

// ✅ بدء الاستماع للتحديثات من Firebase
function startFirebaseListener(deviceId) {
    if (!database || firebaseListener) return;
    
    const requestsRef = database.ref('requests');
    firebaseListener = requestsRef.orderByChild('deviceId').equalTo(deviceId).on('value', (snapshot) => {
        if (snapshot.exists()) {
            snapshot.forEach(childSnapshot => {
                const request = childSnapshot.val();
                if (request.status === 'accepted') {
                    console.log('🎉 تم قبول الطلب من Firebase! جاري التوجيه...');
                    
                    // إيقاف الاستماع
                    if (firebaseListener) {
                        requestsRef.off('value', firebaseListener);
                        firebaseListener = null;
                    }
                    
                    handleAcceptedUser(request);
                }
            });
        }
    });
}

// ✅ التعامل مع المستخدم المقبول
function handleAcceptedUser(userData) {
    // ✅ حفظ بيانات المستخدم للبوابة KR
    localStorage.setItem('kr_user_data', JSON.stringify(userData));
    localStorage.setItem('kr_user_active', 'true');
    localStorage.setItem('kr_user_id', userData.id || '');
    localStorage.setItem('kr_user_name', userData.fullName || '');
    localStorage.setItem('kr_user_dept', userData.departmentName || '');
    localStorage.setItem('kr_user_rank', userData.rank || '');
    
    // ✅ توجيه فوري للبوابة KR الذكية
    window.location.href = 'kr-digital-platform.html';
}

// ✅ دالة التحقق من localStorage
function checkLocalStorageStatus(deviceId) {
    const isAccepted = localStorage.getItem(`user_${deviceId}_accepted`);
    if (isAccepted === 'true') {
        console.log('✅ تم قبول الطلب مسبقاً! جاري التوجيه...');
        const userData = JSON.parse(localStorage.getItem(`user_${deviceId}_data`) || '{}');
        handleAcceptedUser(userData);
        return;
    }
    
    const requests = JSON.parse(localStorage.getItem('admin_pending_requests') || '[]');
    const userRequests = requests.filter(req => req.deviceId === deviceId);
    
    if (userRequests.length > 0) {
        const latestRequest = userRequests.sort((a, b) => new Date(b.submissionDate) - new Date(a.submissionDate))[0];
        existingRequestData = latestRequest;
        hasExistingRequest = true;
        
        if (latestRequest.status === 'accepted') {
            console.log('✅ الحساب مفعّل! جاري التوجيه...');
            handleAcceptedUser(latestRequest);
            return;
        }
        
        if (latestRequest.status === 'pending' || latestRequest.status === 'rejected') {
            showExistingRequest(latestRequest);
            document.getElementById('loadingScreen').style.display = 'none';
            return;
        }
    }
    
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('applicationForm').style.display = 'block';
}

// ✅ عرض حالة الطلب من Firebase
function showFirebaseRequestStatus(firebaseStatus) {
    const messageDiv = document.getElementById('previousRequestMessage');
    const formDiv = document.getElementById('applicationForm');
    
    let statusText, statusClass, statusIcon, statusColor;
    if (firebaseStatus.status === 'pending') { 
        statusText = 'طلبك قيد المراجعة'; 
        statusClass = 'warning'; 
        statusIcon = 'clock'; 
        statusColor = 'var(--warning)'; 
    }
    else if (firebaseStatus.status === 'accepted') { 
        statusText = 'تم تفعيل هويتك بنجاح'; 
        statusClass = 'success'; 
        statusIcon = 'check-circle'; 
        statusColor = 'var(--success)'; 
    }
    else { 
        statusText = 'تم رفض طلبك'; 
        statusClass = 'danger'; 
        statusIcon = 'times-circle'; 
        statusColor = 'var(--danger)'; 
    }
    
    messageDiv.innerHTML = `
        <i class="fas fa-${statusIcon}" style="font-size: 80px; margin-bottom: 30px; color: ${statusColor};"></i>
        <h2 style="font-size: 32px; margin-bottom: 25px;">${statusText}</h2>
        <div style="background: rgba(0,0,0,0.3); border-radius: 16px; padding: 25px; margin: 30px 0;">
            <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
                <span><i class="fas fa-hashtag"></i> رقم الطلب:</span>
                <strong>${firebaseStatus.userData.id}</strong>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
                <span><i class="fas fa-calendar"></i> التاريخ:</span>
                <span>${firebaseStatus.userData.date}</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 12px 0;">
                <span><i class="fas fa-info-circle"></i> الحالة:</span>
                <span style="color: ${statusColor}; font-weight: 700;">
                    ${firebaseStatus.status === 'accepted' ? 'مقبول ✓' : firebaseStatus.status === 'pending' ? 'قيد المراجعة ⏱' : 'مرفوض ✗'}
                </span>
            </div>
        </div>
        ${firebaseStatus.status === 'pending' 
            ? '<p style="color: var(--gray-light); margin-top: 20px; font-size: 16px;"><i class="fas fa-sync-alt fa-spin" style="margin-left: 8px;"></i> جاري مراقبة حالة الطلب تلقائياً... سيتم توجيهك فور القبول</p>'
            : firebaseStatus.status === 'rejected'
            ? '<button class="btn" onclick="startNewRequest()"><i class="fas fa-redo"></i><span>تقديم طلب جديد</span></button>'
            : ''
        }
        <div style="margin-top: 20px; padding: 15px; background: rgba(0, 150, 255, 0.1); border-radius: 12px;">
            <i class="fas fa-database" style="color: #4CAF50; margin-left: 8px;"></i>
            <span style="color: var(--success);">متصل بقاعدة البيانات السحابية</span>
        </div>
    `;
    
    messageDiv.className = `status-message show ${statusClass}`;
    messageDiv.style.background = 'var(--glass)';
    messageDiv.style.backdropFilter = 'blur(20px)';
    messageDiv.style.border = `2px solid ${statusColor}`;
    formDiv.style.display = 'none';
}

// ✅ دالة إرسال الطلب مع Firebase
function submitRequest() {
    const terms1 = document.getElementById('agreeTerms1');
    const terms2 = document.getElementById('agreeTerms2');
    const terms3 = document.getElementById('agreeTerms3');
    
    if (!terms1.checked || !terms2.checked || !terms3.checked) { 
        showAlert('يجب الموافقة على جميع الشروط قبل إرسال الطلب', false); 
        return; 
    }
    
    const requestData = {
        id: 'KR-' + Date.now().toString().slice(-8) + Math.random().toString(36).substr(2, 4).toUpperCase(),
        fullName: document.getElementById('fullName').value.trim(),
        age: parseInt(document.getElementById('age').value),
        gameUsername: document.getElementById('gameUsername').value.trim(),
        discordUsername: document.getElementById('discordUsername').value.trim(),
        gameId: document.getElementById('gameId').value.trim(),
        department: selectedDepartment,
        departmentName: DEPARTMENTS[selectedDepartment].name,
        rank: selectedRank,
        additionals: selectedAdditionals,
        nationalIdImage: uploadedNationalId ? 'uploaded' : null,
        characterImage: uploadedCharacterImage ? 'uploaded' : null,
        date: new Date().toLocaleString('ar-SA', { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric', 
            hour: '2-digit', 
            minute: '2-digit' 
        }),
        submissionDate: new Date().toISOString(),
        status: 'pending',
        deviceId: getDeviceId(),
        timestamp: Date.now()
    };
    
    // ✅ عرض رسالة تحميل
    showAlert('جاري إرسال الطلب إلى قاعدة البيانات السحابية...', true);
    
    // ✅ 1. محاولة حفظ في Firebase
    if (database) {
        saveToFirebase(requestData)
            .then((firebaseKey) => {
                console.log('✅ تم حفظ الطلب في Firebase بنجاح:', firebaseKey);
                
                // ✅ 2. حفظ في localStorage كنسخة احتياطية
                requestData.firebaseKey = firebaseKey;
                let adminRequests = JSON.parse(localStorage.getItem('admin_pending_requests') || '[]');
                adminRequests.unshift(requestData);
                localStorage.setItem('admin_pending_requests', JSON.stringify(adminRequests));
                
                // ✅ 3. تحديث واجهة المستخدم
                hasExistingRequest = true;
                existingRequestData = requestData;
                showSuccessMessage(requestData);
                
                // ✅ 4. بدء الاستماع للتحديثات
                startFirebaseListener(requestData.deviceId);
            })
            .catch((error) => {
                console.error('❌ خطأ في حفظ الطلب في Firebase:', error);
                
                // ✅ إذا فشل Firebase، استخدم localStorage فقط
                showAlert('تم حفظ الطلب محلياً، جاري المحاولة مع السيرفر...', false);
                
                let adminRequests = JSON.parse(localStorage.getItem('admin_pending_requests') || '[]');
                adminRequests.unshift(requestData);
                localStorage.setItem('admin_pending_requests', JSON.stringify(adminRequests));
                
                hasExistingRequest = true;
                existingRequestData = requestData;
                showSuccessMessage(requestData);
            });
    } else {
        // ✅ إذا لم يكن Firebase متاحاً، استخدم localStorage فقط
        let adminRequests = JSON.parse(localStorage.getItem('admin_pending_requests') || '[]');
        adminRequests.unshift(requestData);
        localStorage.setItem('admin_pending_requests', JSON.stringify(adminRequests));
        
        hasExistingRequest = true;
        existingRequestData = requestData;
        showSuccessMessage(requestData);
    }
}

// ✅ دالة حفظ في Firebase
function saveToFirebase(requestData) {
    return new Promise((resolve, reject) => {
        const requestsRef = database.ref('requests');
        const newRequestRef = requestsRef.push();
        
        // إضافة المفتاح للبيانات
        requestData.firebaseKey = newRequestRef.key;
        
        newRequestRef.set(requestData)
            .then(() => {
                resolve(newRequestRef.key);
            })
            .catch(error => {
                reject(error);
            });
    });
}

// ✅ باقي الدوال (تظل كما هي مع تعديلات بسيطة)
function showSuccessMessage(requestData) {
    const form = document.getElementById('applicationForm');
    const successMessage = document.getElementById('successMessage');
    const successDetails = document.getElementById('successDetails');
    
    const isFirebase = !!requestData.firebaseKey;
    
    successDetails.innerHTML = `
        <div style="background: rgba(0,0,0,0.3); border-radius: 20px; padding: 35px; margin: 35px 0; border: 1px solid rgba(255,255,255,0.1);">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
                <span style="color: var(--gray-light);"><i class="fas fa-hashtag"></i> رقم الطلب:</span>
                <span style="font-weight: 800; font-size: 20px; color: var(--accent);">${requestData.id}</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
                <span style="color: var(--gray-light);"><i class="fas fa-calendar"></i> تاريخ التقديم:</span>
                <span style="font-weight: 600;">${requestData.date}</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
                <span style="color: var(--gray-light);"><i class="fas fa-building"></i> الوزارة:</span>
                <span style="font-weight: 600;">${requestData.departmentName}</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
                <span style="color: var(--gray-light);"><i class="fas fa-database"></i> حالة الحفظ:</span>
                <span style="font-weight: 600; color: ${isFirebase ? '#4CAF50' : '#FF9800'}">
                    ${isFirebase ? 'السحابة ✓' : 'محلي ⚠️'}
                </span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 0;">
                <span style="color: var(--gray-light);"><i class="fas fa-info-circle"></i> الحالة:</span>
                <span style="color: var(--warning); font-weight: 700; font-size: 18px;">
                    <i class="fas fa-clock"></i> قيد المراجعة
                </span>
            </div>
        </div>
        <p style="color: var(--gray-light); font-size: 16px; text-align: center; margin-top: 20px;">
            <i class="fas fa-sync-alt fa-spin" style="margin-left: 8px;"></i> 
            ${isFirebase 
                ? 'سيتم توجيهك تلقائياً للبوابة KR فور قبول طلبك من المسؤول'
                : 'جاري المحاولة للاتصال بالسيرفر...'
            }
        </p>
    `;
    
    form.style.display = 'none';
    successMessage.style.display = 'block';
    successMessage.classList.add('show');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    
    // إذا كان متصلاً ب Firebase، ابدأ الاستماع للتحديثات
    if (isFirebase && database) {
        startFirebaseListener(requestData.deviceId);
    }
}

// ✅ دالة البدء من جديد
function startNewRequest() {
    if (firebaseListener && database) {
        const requestsRef = database.ref('requests');
        requestsRef.off('value', firebaseListener);
        firebaseListener = null;
    }
    
    document.getElementById('previousRequestMessage').style.display = 'none';
    document.getElementById('applicationForm').style.display = 'block';
    hasExistingRequest = false;
    existingRequestData = null;
    
    // إعادة تعيين الحقول
    document.getElementById('fullName').value = '';
    document.getElementById('age').value = '';
    document.getElementById('gameUsername').value = '';
    document.getElementById('discordUsername').value = '';
    document.getElementById('gameId').value = '';
    selectedDepartment = null;
    selectedRank = null;
    selectedAdditionals = [];
    
    // إعادة تعيين الخطوات
    document.getElementById('step1').style.display = 'block';
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step3').style.display = 'none';
    document.getElementById('step4').style.display = 'none';
    document.getElementById('step5').style.display = 'none';
    
    resetDepartmentSelection();
}

// ✅ الدوال المساعدة (تظل كما هي)
function getDeviceId() {
    let deviceId = localStorage.getItem('device_id');
    if (!deviceId) { 
        deviceId = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9); 
        localStorage.setItem('device_id', deviceId); 
    }
    return deviceId;
}

// ✅ عند إغلاق الصفحة
window.addEventListener('beforeunload', function() {
    if (firebaseListener && database) {
        const requestsRef = database.ref('requests');
        requestsRef.off('value', firebaseListener);
    }
});

// ✅ باقي الدوال (setupGameIdField, validateStep1, showStep2, selectDepartment, etc.)
// ... تظل كما هي بدون تغيير
</script>
