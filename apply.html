<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بوابة التسجيل الرقمي - KR</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>
    <style>
        body { background: #0a0e1a; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
        .form-container { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 15px; max-width: 400px; margin: auto; border: 1px solid #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ff6f00; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>نموذج طلب اعتماد هوية</h2>
        <p style="font-size: 12px; opacity: 0.7;">يرجى إدخال البيانات بدقة لضمان سرعة الاعتماد</p>
        
        <input type="text" id="fullName" placeholder="الاسم الرباعي">
        <input type="text" id="gameId" placeholder="الرقم العسكري / المعرف">
        <input type="text" id="discordUsername" placeholder="اسم المستخدم في ديسكورد">
        
        <button onclick="submitToSystem()">إرسال الطلب للمراجعة</button>
    </div>

    <script>
        // الربط الفني بمركز البيانات
        const firebaseConfig = {
            apiKey: "AIzaSyB68LMIIbyS86NgXYMR6ramIayZvKx1yxo",
            authDomain: "kr-system-5c846.firebaseapp.com",
            projectId: "kr-system-5c846",
            storageBucket: "kr-system-5c846.firebasestorage.app",
            messagingSenderId: "676032414707",
            appId: "1:676032414707:web:f2f535b87522b2402f4886"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function submitToSystem() {
            const name = document.getElementById('fullName').value;
            const id = document.getElementById('gameId').value;
            const dc = document.getElementById('discordUsername').value;

            if(!name || !id) return alert("يرجى إكمال الحقول الأساسية");

            try {
                await db.collection("requests").add({
                    fullName: name,
                    gameId: id,
                    discordUsername: dc,
                    status: "pending",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("✅ تم إرسال طلبك لمركز الإدارة. يرجى انتظار الاعتماد.");
            } catch (e) {
                alert("❌ فشل الاتصال بمركز البيانات");
            }
        }
    </script>
</body>
</html>
