<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقديم طلب تفعيل الهوية - هيئة KR الرقمية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        header {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            padding: 25px 30px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo i {
            font-size: 32px;
        }
        
        nav {
            margin-top: 15px;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            padding: 10px 15px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        nav a:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        nav a.active {
            background: white;
            color: #1e3a8a;
        }
        
        .content {
            padding: 30px;
        }
        
        .alert {
            background: #fee2e2;
            color: #991b1b;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center;
            border: 2px solid #f87171;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .alert.show {
            display: block;
        }
        
        .alert.success {
            background: #d1fae5;
            color: #065f46;
            border-color: #10b981;
        }
        
        .alert.warning {
            background: #fef3c7;
            color: #92400e;
            border-color: #f59e0b;
        }
        
        .step {
            background: #f8fafc;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border: 2px solid #e2e8f0;
        }
        
        .step-title {
            color: #1e3a8a;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
        }
        
        .step-title .number {
            background: #3b82f6;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .input-group input.error {
            border-color: #ef4444;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .input-hint {
            font-size: 14px;
            color: #64748b;
            margin-top: 5px;
            padding-right: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        /* مثال صورة الهوية */
        .id-example {
            background: #f0f9ff;
            border-radius: 15px;
            padding: 25px;
            border: 2px solid #e0f2fe;
            margin: 20px 0;
        }
        
        .id-example h4 {
            color: #1e3a8a;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .id-example-content {
            display: flex;
            gap: 25px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .id-example-img {
            flex: 1;
            min-width: 300px;
            border: 3px solid #3b82f6;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .id-example-img img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .id-example-steps {
            flex: 1;
            min-width: 300px;
        }
        
        .id-example-steps ol {
            padding-right: 20px;
            margin: 15px 0;
        }
        
        .id-example-steps li {
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        
        /* بقية الأنماط */
        .example-box {
            background: #f0f9ff;
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            border: 2px solid #e0f2fe;
        }
        
        .example-box p {
            color: #0369a1;
            margin: 0;
            font-size: 14px;
        }
        
        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 25px 0;
        }
        
        .job-card {
            background: white;
            border: 3px solid #e2e8f0;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .job-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .job-card.selected {
            border-color: #3b82f6;
            background: #eff6ff;
        }
        
        .job-card i {
            font-size: 35px;
            margin-bottom: 15px;
        }
        
        .job-card.citizen i { color: #7c3aed; }
        .job-card.interior i { color: #1e3a8a; }
        .job-card.health i { color: #dc2626; }
        .job-card.justice i { color: #059669; }
        
        .ranks-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #e2e8f0;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .rank-item {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .rank-item:hover {
            background: #f8fafc;
        }
