<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقديم طلب تفعيل | KR</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1a237e; --accent: #ff6f00; --dark: #0d1117; --border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0d1117; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { width: 100%; max-width: 500px; background: rgba(255,255,255,0.03); padding: 30px; border-radius: 20px; border: 1px solid var(--border); backdrop-filter: blur(10px); }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--accent); font-size: 14px; }
        input, select { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 10px; color: white; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); }
        .btn { width: 100%; padding: 15px; background: var(--accent); border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        h2 { text-align: center; margin-bottom: 25px; color: white; }
    </style>
</head>
<body>

<div class="card">
    <h2><i class="fas fa-id-card"></i> بوابة التقديم الرقمية</h2>
    
    <div class="input-group">
        <label>الاسم الكامل (داخل اللعبة)</label>
        <input type="text" id="fullName" placeholder="مثال: محمد عبدالله">
    </div>

    <div class="input-group">
        <label>الآيدي (ID)</label>
        <input type="number" id="gameId" placeholder="مثال: 102">
    </div>

    <div class="input-group">
        <label>التصنيف</label>
        <select id="dept">
            <option value="مواطن">مواطن</option>
            <option value="وزارة الداخلية">وزارة الداخلية</option>
            <option value="وزارة الصحة">وزارة الصحة</option>
        </select>
    </div>

    <button class="btn" onclick="sendOrder()">إرسال الطلب للمراجعة</button>
</div>

<script>
    // تهيئة Firebase بالرابط الخاص بك
    const firebaseConfig = {
        databaseURL: "https://myproject-7439e-default-rtdb.firebaseio.com/"
    };

    // منع تكرار التهيئة لتجنب الأخطاء
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    function sendOrder() {
        const name = document.getElementById('fullName').value;
        const gid = document.getElementById('gameId').value;
        const dpt = document.getElementById('dept').value;

        if (!name || !gid) {
            alert("يا غالي عبّي بياناتك أولاً!");
            return;
        }

        const btn = document.querySelector('.btn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';

        const orderId = 'KR-' + Date.now();

        // إرسال البيانات لقاعدة البيانات مباشرة
        db.ref('orders/' + orderId).set({
            fullName: name,
            gameId: gid,
            departmentName: dpt,
            status: 'pending', // الحالة الافتراضية
            date: new Date().toLocaleString('ar-SA')
        }).then(() => {
            alert("تم إرسال طلبك بنجاح! انتظر قبول الإدارة.");
            btn.disabled = false;
            btn.innerHTML = 'إرسال الطلب للمراجعة';
            // مسح الحقول بعد الإرسال
            document.getElementById('fullName').value = '';
            document.getElementById('gameId').value = '';
        }).catch((err) => {
            alert("حدث خطأ: " + err.message);
            btn.disabled = false;
            btn.innerHTML = 'إعادة المحاولة';
        });
    }
</script>

</body>
</html>
