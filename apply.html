<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقديم تفعيل الهوية</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
</head>
<body>
    <h2>تقديم طلب تفعيل الهوية</h2>

    <label>الاسم الكامل:</label>
    <input type="text" id="fullName"><br><br>

    <label>رقم الهوية/اللعبة:</label>
    <input type="text" id="gameId"><br><br>

    <label>رفع صورة الهوية أو الشخصية:</label>
    <input type="file" id="identityImage" accept="image/*"><br><br>

    <button onclick="submitApplication()">تقديم الطلب</button>

    <script>
      // 🟢 Firebase config
      const firebaseConfig = {
        apiKey: "AIzaSyCuP4NMBR-hDYZjI88hrnP-maWRs9wDK_I",
        authDomain: "myproject-7439e.firebaseapp.com",
        projectId: "myproject-7439e",
        storageBucket: "myproject-7439e.appspot.com",
        messagingSenderId: "469567490419",
        appId: "1:469567490419:web:ce6453c7f74d1863c61d06"
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      const storage = firebase.storage();

      // 🟢 إرسال الطلب
      async function submitApplication() {
        const fullName = document.getElementById("fullName").value.trim();
        const gameId = document.getElementById("gameId").value.trim();
        const imageFile = document.getElementById("identityImage").files[0];

        if (!fullName || !gameId || !imageFile) {
          alert("عبّ كل البيانات ورفع صورة الهوية!");
          return;
        }

        try {
          // 1️⃣ رفع الصورة إلى Firebase Storage
          const storageRef = storage.ref().child("identity_images/" + Date.now() + "_" + imageFile.name);
          const snapshot = await storageRef.put(imageFile);
          const imageUrl = await snapshot.ref.getDownloadURL();

          // 2️⃣ إضافة البيانات إلى Firestore
          await db.collection("activation_requests").add({
            fullName: fullName,
            gameId: gameId,
            status: "pending",   // في الانتظار
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            identityImage: imageUrl
          });

          alert("تم إرسال الطلب بنجاح ⏳");
          // 👇 مسح الحقول بعد الإرسال
          document.getElementById("fullName").value = "";
          document.getElementById("gameId").value = "";
          document.getElementById("identityImage").value = "";

        } catch (err) {
          alert("حدث خطأ: " + err.message);
        }
      }
    </script>
</body>
</html>
