<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب تفعيل الهوية - منصة KR</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        /* ... (كل CSS السابق يبقى كما هو) ... */
        
        /* تنبيهات جديدة */
        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            min-width: 300px;
            max-width: 400px;
            padding: 15px 20px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            animation: slideInRight 0.5s ease, fadeOut 0.5s ease 4.5s forwards;
            backdrop-filter: blur(10px);
        }
        
        .alert-success {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.9), rgba(5, 150, 105, 0.9));
            border-left: 5px solid #10b981;
        }
        
        .alert-error {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.9), rgba(220, 38, 38, 0.9));
            border-left: 5px solid #ef4444;
        }
        
        .alert-warning {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.9), rgba(217, 119, 6, 0.9));
            border-left: 5px solid #f59e0b;
        }
        
        .alert-info {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.9), rgba(37, 99, 235, 0.9));
            border-left: 5px solid #3b82f6;
        }
        
        .alert-icon {
            font-size: 20px;
        }
        
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }
        
        /* تحسين الحقول */
        .form-group.error input,
        .form-group.error select,
        .form-group.error .file-upload-wrapper {
            border-color: #ef4444 !important;
            background: rgba(239, 68, 68, 0.1) !important;
        }
        
        .error-message {
            color: #ef4444;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        
        .form-group.error .error-message {
            display: block;
        }
        
        /* تأثيرات جديدة */
        .btn-pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(212, 175, 55, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(212, 175, 55, 0);
            }
        }
        
        .floating-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, var(--primary-gold), #f4e5b8);
            color: var(--primary-dark);
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
            font-weight: 600;
            z-index: 9999;
            animation: floatUp 0.5s ease;
        }
        
        @keyframes floatUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- التنبيهات العائمة -->
    <div id="alertContainer" style="position: fixed; top: 20px; right: 20px; z-index: 10000;"></div>

    <header>
        <div class="header-content">
            <div class="logo-section">
                <div class="logo">KR</div>
                <div class="site-title">
                    <h1>منصة KR</h1>
                    <p>طلب تفعيل الهوية</p>
                </div>
            </div>
            <a href="index.html" class="btn-back">← العودة للرئيسية</a>
        </div>
    </header>

    <!-- ... (بقية HTML كما هو) ... -->

    <script>
        // تهيئة Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyC17Jg6PLB2g8-J5IGBihqj_hb9lSLkraM",
            authDomain: "kr-system-5c846.firebaseapp.com",
            databaseURL: "https://kr-system-5c846-default-rtdb.firebaseio.com",
            projectId: "kr-system-5c846",
            storageBucket: "kr-system-5c846.appspot.com",
            messagingSenderId: "420668677876",
            appId: "1:420668677876:web:35e59b7b1da4c3ec171f15"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        let currentStep = 1;
        const totalSteps = 4;

        // نظام التنبيهات
        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alertId = 'alert-' + Date.now();
            
            const alertDiv = document.createElement('div');
            alertDiv.id = alertId;
            alertDiv.className = `alert alert-${type}`;
            
            let icon = 'ℹ️';
            switch(type) {
                case 'success': icon = '✅'; break;
                case 'error': icon = '❌'; break;
                case 'warning': icon = '⚠️'; break;
                case 'info': icon = 'ℹ️'; break;
            }
            
            alertDiv.innerHTML = `
                <span class="alert-icon">${icon}</span>
                <span>${message}</span>
            `;
            
            alertContainer.appendChild(alertDiv);
            
            setTimeout(() => {
                const alert = document.getElementById(alertId);
                if (alert) alert.remove();
            }, 5000);
        }

        // تحقق من الحقول الفارغة
        function checkEmptyFields() {
            const currentStepElement = document.querySelector(`.form-step[data-step="${currentStep}"]`);
            const inputs = currentStepElement.querySelectorAll('input[required], select[required]');
            let hasError = false;
            
            inputs.forEach(input => {
                const formGroup = input.closest('.form-group');
                const errorMessage = formGroup.querySelector('.error-message') || 
                    (() => {
                        const span = document.createElement('span');
                        span.className = 'error-message';
                        formGroup.appendChild(span);
                        return span;
                    })();
                
                if (!input.value) {
                    formGroup.classList.add('error');
                    errorMessage.textContent = 'هذا الحقل مطلوب';
                    hasError = true;
                    
                    // إضافة تأثير اهتزاز
                    input.style.animation = 'shake 0.5s';
                    setTimeout(() => {
                        input.style.animation = '';
                    }, 500);
                    
                } else {
                    formGroup.classList.remove('error');
                    errorMessage.textContent = '';
                }
            });
            
            return !hasError;
        }

        // تحقق من الملفات
        function checkFiles() {
            if (currentStep === 2) {
                const files = [
                    { id: 'idImageGame', name: 'صورة الهوية' },
                    { id: 'personalPhoto', name: 'الصورة الشخصية' }
                ];
                
                let hasError = false;
                
                files.forEach(file => {
                    const input = document.getElementById(file.id);
                    const wrapper = document.getElementById(file.id + 'Wrapper');
                    const formGroup = input.closest('.form-group');
                    
                    if (!input.files.length) {
                        formGroup.classList.add('error');
                        const errorMessage = formGroup.querySelector('.error-message') || 
                            (() => {
                                const span = document.createElement('span');
                                span.className = 'error-message';
                                formGroup.appendChild(span);
                                return span;
                            })();
                        
                        errorMessage.textContent = `يرجى رفع ${file.name}`;
                        hasError = true;
                        
                        wrapper.style.animation = 'shake 0.5s';
                        setTimeout(() => {
                            wrapper.style.animation = '';
                        }, 500);
                        
                        showAlert(`يرجى رفع ${file.name}`, 'error');
                    } else {
                        formGroup.classList.remove('error');
                        const errorMessage = formGroup.querySelector('.error-message');
                        if (errorMessage) errorMessage.textContent = '';
                    }
                });
                
                return !hasError;
            }
            return true;
        }

        // تحويل الملفات إلى Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // حفظ الطلب في Firebase
        async function saveApplication(applicationData) {
            try {
                const applicationsRef = database.ref('applications');
                const newApplicationRef = applicationsRef.push();
                
                await newApplicationRef.set(applicationData);
                
                // حفظ الإشعار
                const notificationRef = database.ref('notifications').push();
                await notificationRef.set({
                    userId: applicationData.userId || 'guest',
                    title: 'تم تقديم طلبك بنجاح',
                    message: `تم استلام طلب تفعيل الهوية برقم ${newApplicationRef.key}`,
                    type: 'success',
                    read: false,
                    createdAt: firebase.database.ServerValue.TIMESTAMP
                });
                
                return newApplicationRef.key;
            } catch (error) {
                console.error('Error saving application:', error);
                throw error;
            }
        }

        // تعديل دالة التقديم
        async function submitForm() {
            try {
                // تحقق من جميع الحقول
                if (!validateAllFields()) {
                    showAlert('يرجى تعبئة جميع الحقول المطلوبة بشكل صحيح', 'error');
                    return;
                }

                document.getElementById('submitButtons').style.display = 'none';
                document.getElementById('loadingSpinner').classList.add('show');

                // تحويل الملفات إلى Base64
                const idImageGameFile = document.getElementById('idImageGame').files[0];
                const personalPhotoFile = document.getElementById('personalPhoto').files[0];
                
                const idImageGameBase64 = await fileToBase64(idImageGameFile);
                const personalPhotoBase64 = await fileToBase64(personalPhotoFile);
                
                let discordRanksBase64 = null;
                const discordRanksFile = document.getElementById('discordRanks').files[0];
                if (discordRanksFile) {
                    discordRanksBase64 = await fileToBase64(discordRanksFile);
                }

                // جمع البيانات
                const occupation = document.getElementById('occupation').value;
                let rank = null;
                let positions = [];

                if (occupation !== 'مواطن') {
                    if (occupation === 'وزارة الداخلية') {
                        rank = document.getElementById('interiorRank').value;
                        const posSelect = document.getElementById('interiorPosition');
                        positions = Array.from(posSelect.selectedOptions).map(opt => opt.value);
                    } else if (occupation === 'وزارة العدل') {
                        rank = document.getElementById('justiceRank').value;
                        const posSelect = document.getElementById('justicePosition');
                        positions = Array.from(posSelect.selectedOptions).map(opt => opt.value);
                    } else if (occupation === 'وزارة الصحة') {
                        rank = document.getElementById('healthRank').value;
                        const posSelect = document.getElementById('healthPosition');
                        positions = Array.from(posSelect.selectedOptions).map(opt => opt.value);
                    }
                }

                // بيانات الطلب
                const applicationData = {
                    personalInfo: {
                        fullName: document.getElementById('fullName').value,
                        age: document.getElementById('age').value,
                        gameName: document.getElementById('gameName').value,
                        discordName: document.getElementById('discordName').value,
                        nationalId: document.getElementById('nationalId').value
                    },
                    occupation: {
                        type: occupation,
                        rank: rank,
                        positions: positions
                    },
                    documents: {
                        idImageGame: idImageGameBase64,
                        personalPhoto: personalPhotoBase64,
                        discordRanks: discordRanksBase64
                    },
                    status: 'pending',
                    adminNotes: '',
                    submittedAt: firebase.database.ServerValue.TIMESTAMP,
                    reviewedAt: null,
                    reviewedBy: null
                };

                // حفظ في Firebase
                const applicationId = await saveApplication(applicationData);

                // إظهار رسالة النجاح
                document.getElementById('loadingSpinner').classList.remove('show');
                document.getElementById('successMessage').classList.add('show');
                document.getElementById('applicationNumber').textContent = applicationId;

                showAlert('تم تقديم طلبك بنجاح! سيتم مراجعته قريباً', 'success');

                // إظهار تنبيه عائم
                showFloatingNotification('طلبك رقم: ' + applicationId);

                // إرسال إشعار للإدارة
                sendAdminNotification(applicationId, applicationData.personalInfo.fullName);

            } catch (error) {
                console.error('Error:', error);
                showAlert('حدث خطأ أثناء إرسال الطلب. يرجى المحاولة مرة أخرى', 'error');
                
                document.getElementById('loadingSpinner').classList.remove('show');
                document.getElementById('submitButtons').style.display = 'flex';
            }
        }

        // إرسال إشعار للإدارة
        async function sendAdminNotification(applicationId, userName) {
            try {
                const notificationRef = database.ref('adminNotifications').push();
                await notificationRef.set({
                    title: 'طلب جديد',
                    message: `طلب تفعيل جديد من ${userName}`,
                    applicationId: applicationId,
                    read: false,
                    createdAt: firebase.database.ServerValue.TIMESTAMP
                });
            } catch (error) {
                console.error('Error sending admin notification:', error);
            }
        }

        // إظهار تنبيه عائم
        function showFloatingNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'floating-notification';
            notification.textContent = message;
            notification.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: linear-gradient(135deg, var(--primary-gold), #f4e5b8);
                color: var(--primary-dark);
                padding: 10px 20px;
                border-radius: 10px;
                box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
                font-weight: 600;
                z-index: 9999;
                animation: floatUp 0.5s ease;
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'fadeOut 0.5s ease forwards';
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 500);
            }, 5000);
        }

        // تحقق شامل من جميع الحقول
        function validateAllFields() {
            let isValid = true;
            
            // تحقق من الخطوة 1
            if (!document.getElementById('agreeTerms').checked) {
                showAlert('يرجى الموافقة على الشروط والأحكام', 'error');
                return false;
            }
            
            // تحقق من الخطوة 2
            const step2Fields = [
                { id: 'fullName', name: 'الاسم الرباعي' },
                { id: 'age', name: 'العمر' },
                { id: 'gameName', name: 'اسم الحساب في اللعبة' },
                { id: 'discordName', name: 'اسم الحساب في الديسكورد' },
                { id: 'nationalId', name: 'رقم الهوية' }
            ];
            
            for (const field of step2Fields) {
                const input = document.getElementById(field.id);
                if (!input.value) {
                    showAlert(`يرجى تعبئة حقل ${field.name}`, 'error');
                    isValid = false;
                }
            }
            
            // تحقق من الملفات
            if (!document.getElementById('idImageGame').files.length) {
                showAlert('يرجى رفع صورة الهوية', 'error');
                isValid = false;
            }
            
            if (!document.getElementById('personalPhoto').files.length) {
                showAlert('يرجى رفع صورتك الشخصية', 'error');
                isValid = false;
            }
            
            // تحقق من الخطوة 3
            const occupation = document.getElementById('occupation').value;
            if (!occupation) {
                showAlert('يرجى اختيار المهنة', 'error');
                isValid = false;
            }
            
            if (occupation !== 'مواطن') {
                if (occupation === 'وزارة الداخلية' && !document.getElementById('interiorRank').value) {
                    showAlert('يرجى اختيار الرتبة', 'error');
                    isValid = false;
                } else if (occupation === 'وزارة العدل' && !document.getElementById('justiceRank').value) {
                    showAlert('يرجى اختيار الرتبة', 'error');
                    isValid = false;
                } else if (occupation === 'وزارة الصحة' && !document.getElementById('healthRank').value) {
                    showAlert('يرجى اختيار الرتبة', 'error');
                    isValid = false;
                }
                
                if (!document.getElementById('discordRanks').files.length) {
                    showAlert('يرجى رفع صورة الرتب في الديسكورد', 'error');
                    isValid = false;
                }
            }
            
            return isValid;
        }

        // إضافة تحقق أثناء الكتابة
        function setupRealTimeValidation() {
            const inputs = document.querySelectorAll('input[required], select[required]');
            
            inputs.forEach(input => {
                input.addEventListener('blur', function() {
                    const formGroup = this.closest('.form-group');
                    if (!this.value && this.hasAttribute('required')) {
                        formGroup.classList.add('error');
                        const errorMessage = formGroup.querySelector('.error-message') || 
                            (() => {
                                const span = document.createElement('span');
                                span.className = 'error-message';
                                formGroup.appendChild(span);
                                return span;
                            })();
                        errorMessage.textContent = 'هذا الحقل مطلوب';
                    } else {
                        formGroup.classList.remove('error');
                        const errorMessage = formGroup.querySelector('.error-message');
                        if (errorMessage) errorMessage.textContent = '';
                    }
                });
                
                input.addEventListener('input', function() {
                    const formGroup = this.closest('.form-group');
                    if (this.value) {
                        formGroup.classList.remove('error');
                        const errorMessage = formGroup.querySelector('.error-message');
                        if (errorMessage) errorMessage.textContent = '';
                    }
                });
            });
        }

        // تعديل دالة nextStep
        function nextStep() {
            if (!checkEmptyFields()) {
                showAlert('يرجى تعبئة جميع الحقول المطلوبة', 'error');
                return;
            }
            
            if (!checkFiles()) {
                return;
            }
            
            if (currentStep === 3) {
                updateReview();
            }

            if (currentStep < totalSteps) {
                currentStep++;
                updateStepIndicator();
                window.scrollTo(0, 0);
                showAlert('تم الانتقال للخطوة التالية', 'success');
            }
        }

        // تعديل دالة prevStep
        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                updateStepIndicator();
                window.scrollTo(0, 0);
                showAlert('تم العودة للخطوة السابقة', 'info');
            }
        }

        // إضافة تأثيرات CSS للاهتزاز
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                20%, 40%, 60%, 80% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);

        // تهيئة التحقق في الوقت الحقيقي
        document.addEventListener('DOMContentLoaded', function() {
            setupRealTimeValidation();
            updateStepIndicator();
            
            // إضافة أزرار التحقق
            document.querySelectorAll('.btn-primary').forEach(btn => {
                btn.addEventListener('mouseenter', function() {
                    this.classList.add('btn-pulse');
                });
                
                btn.addEventListener('mouseleave', function() {
                    this.classList.remove('btn-pulse');
                });
            });
            
            // تحقق من الملفات عند التغيير
            document.querySelectorAll('input[type="file"]').forEach(input => {
                input.addEventListener('change', function() {
                    const wrapper = document.getElementById(this.id + 'Wrapper');
                    if (this.files.length) {
                        wrapper.classList.add('has-file');
                        showAlert('تم اختيار الملف بنجاح', 'success');
                    }
                });
            });
            
            // عرض إرشادات التقديم
            setTimeout(() => {
                showAlert('مرحباً! يرجى قراءة الشروط والأحكام قبل البدء', 'info');
            }, 1000);
        });
    </script>
</body>
</html>
