<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KR System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: linear-gradient(135deg, #667eea, #764ba2); padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; border-radius: 15px; padding: 30px; }
        h1 { color: #1e3a8a; margin-bottom: 20px; text-align: center; }
        .input-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        .btn { background: #3b82f6; color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏛️ نظام KR الرقمية</h1>
        
        <div class="input-group">
            <label>الاسم الكامل:</label>
            <input type="text" id="name" placeholder="أحمد محمد">
        </div>
        
        <div class="input-group">
            <label>العمر:</label>
            <input type="number" id="age" placeholder="25">
        </div>
        
        <div class="input-group">
            <label>رقم الهوية (10 أرقام):</label>
            <input type="text" id="id" placeholder="1234567890" maxlength="10">
        </div>
        
        <button class="btn" onclick="showMessage()">إرسال الطلب</button>
        
        <div id="message" style="margin-top: 20px; padding: 15px; background: #d1fae5; border-radius: 8px; display: none;">
            ✅ تم إرسال الطلب بنجاح!
        </div>
    </div>

    <script>
        function showMessage() {
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const id = document.getElementById('id').value;
            
            if(name && age && id.length === 10) {
                document.getElementById('message').style.display = 'block';
            } else {
                alert('❌ يرجى تعبئة جميع الحقول بشكل صحيح');
            }
        }
    </script>
</body>
</html>
