<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هيئة KR الرقمية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background"></div>
    
    <div class="container">
        <!-- الهيدر -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-id-badge"></i>
                <div class="logo-text">
                    <h1>هيئة KR الرقمية</h1>
                    <p>نظام تفعيل الهوية الوطنية</p>
                </div>
            </div>
        </header>

        <!-- الخطوات -->
        <div class="steps">
            <div class="step active">1</div>
            <div class="step">2</div>
            <div class="step">3</div>
            <div class="step">4</div>
        </div>

        <!-- الفورم الرئيسي -->
        <form id="mainForm" class="form">
            <!-- الخطوة 1: البيانات -->
            <div class="form-step active" id="step1">
                <h2><i class="fas fa-user-edit"></i> البيانات الشخصية</h2>
                
                <div class="form-group">
                    <div class="input-container">
                        <i class="fas fa-signature"></i>
                        <input type="text" id="fullName" placeholder="الاسم الكامل" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-container">
                        <i class="fas fa-calendar-alt"></i>
                        <input type="number" id="age" placeholder="العمر" min="18" max="100" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-container">
                        <i class="fab fa-discord"></i>
                        <input type="text" id="discord" placeholder="اسم المستخدم في الديسكورد" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-container">
                        <i class="fas fa-id-card"></i>
                        <input type="text" id="nationalId" placeholder="رقم الهوية الوطنية (10 أرقام)" maxlength="10" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-next" onclick="nextStep(2)">التالي</button>
                </div>
            </div>

            <!-- الخطوة 2: الوظيفة -->
            <div class="form-step" id="step2">
                <h2><i class="fas fa-briefcase"></i> اختيار الوظيفة</h2>
                
                <div class="options-grid">
                    <div class="option-card" data-value="citizen">
                        <i class="fas fa-user"></i>
                        <h3>مواطن</h3>
                    </div>
                    
                    <div class="option-card" data-value="interior">
                        <i class="fas fa-shield-alt"></i>
                        <h3>منسوب الداخلية</h3>
                    </div>
                    
                    <div class="option-card" data-value="health">
                        <i class="fas fa-heartbeat"></i>
                        <h3>منسوب الصحة</h3>
                    </div>
                    
                    <div class="option-card" data-value="justice">
                        <i class="fas fa-balance-scale"></i>
                        <h3>منسوب العدل</h3>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-prev" onclick="prevStep(1)">السابق</button>
                    <button type="button" class="btn btn-next" id="nextStep2" disabled onclick="nextStep(3)">التالي</button>
                </div>
            </div>

            <!-- الخطوة 3: المنصب -->
            <div class="form-step" id="step3">
                <h2 id="positionTitle"><i class="fas fa-user-tie"></i> اختيار المنصب</h2>
                
                <div class="positions-container" id="positionsContainer">
                    <!-- المناصب ستظهر هنا -->
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-prev" onclick="prevStep(2)">السابق</button>
                    <button type="button" class="btn btn-next" id="nextStep3" disabled onclick="nextStep(4)">التالي</button>
                </div>
            </div>

            <!-- الخطوة 4: المناصب الإضافية -->
            <div class="form-step" id="step4">
                <h2><i class="fas fa-layer-group"></i> المناصب الإضافية</h2>
                
                <div class="additional-positions" id="additionalContainer">
                    <!-- المناصب الإضافية ستظهر هنا -->
                </div>

                <div class="no-positions">
                    <input type="checkbox" id="noPositions">
                    <label for="noPositions">لا أملك مناصب إضافية</label>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-prev" onclick="prevStep(3)">السابق</button>
                    <button type="button" class="btn btn-submit" id="submitBtn">إرسال الطلب</button>
                </div>
            </div>
        </form>

        <!-- رسالة النجاح -->
        <div class="success-message" id="successMessage">
            <i class="fas fa-check-circle"></i>
            <h3>تم إرسال طلبك بنجاح</h3>
            <p>رقم الطلب: <span id="requestId">KR-0001</span></p>
            <button class="btn btn-new" onclick="resetForm()">طلب جديد</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
