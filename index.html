<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار</title>
    <style>
        body { background: #667eea; padding: 20px; font-family: Arial; }
        .box { background: white; padding: 30px; border-radius: 15px; max-width: 500px; margin: auto; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #ddd; border-radius: 10px; }
        .btn { background: #3b82f6; color: white; border: none; padding: 16px; width: 100%; border-radius: 10px; cursor: pointer; }
        .alert { background: red; color: white; padding: 15px; margin: 10px 0; border-radius: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <h1 style="text-align: center;">اختبار الحقول الجديدة</h1>
        
        <input type="text" id="gameName" placeholder="اسمك في اللعبة">
        <input type="text" id="discordName" placeholder="اسمك في الديسكورد">
        
        <button class="btn" onclick="test()">اختبر</button>
        
        <div class="alert" id="alert" style="display: none;"></div>
    </div>

    <script>
        function test() {
            const gameName = document.getElementById('gameName').value;
            const discordName = document.getElementById('discordName').value;
            const alertBox = document.getElementById('alert');
            
            if (!gameName || !discordName) {
                alertBox.textContent = '❌ املأ الحقول أولاً!';
                alertBox.style.display = 'block';
                alertBox.style.background = 'red';
            } else {
                alertBox.textContent = '✅ كتبت: ' + gameName + ' | ديسكورد: ' + discordName;
                alertBox.style.display = 'block';
                alertBox.style.background = 'green';
            }
        }
        
        console.log('الصفحة جاهزة للاختبار');
    </script>
</body>
</html>
