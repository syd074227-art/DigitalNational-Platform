<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KR | المنصة الرقمية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        :root {
            --primary: #0c1528;
            --secondary: #162447;
            --accent: #1f4068;
            --neon: #00c9ff;
            --light: #e0f7ff;
            --gradient: linear-gradient(135deg, #0c1528 0%, #162447 50%, #1f4068 100%);
            --gradient-light: linear-gradient(135deg, #00c9ff 0%, #1f4068 100%);
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            --transition: all 0.4s ease;
        }
        
        body {
            background: var(--primary);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* خلفية ثابتة */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 20% 80%, rgba(31, 64, 104, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 201, 255, 0.2) 0%, transparent 50%),
                linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        }
        
        /* شبكة خفيفة ثابتة */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 201, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 201, 255, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -1;
            opacity: 0.5;
        }
        
        /* اسم المنصة */
        .platform-name {
            position: fixed;
            top: 40px;
            right: 50px;
            z-index: 100;
            text-align: right;
            transition: var(--transition);
        }
        
        .kr-logo {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--light), var(--neon));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        
        .platform-subtitle {
            font-size: 1rem;
            color: rgba(224, 247, 255, 0.7);
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
        }
        
        /* المحتوى الرئيسي - مركز تماماً */
        .main-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
        
        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 25px;
            background: linear-gradient(135deg, var(--light), var(--neon));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
            opacity: 0;
            animation: fadeInUp 1s ease 0.3s forwards;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
            from {
                opacity: 0;
                transform: translateY(30px);
            }
        }
        
        .hero-subtitle {
            font-size: 1.3rem;
            color: rgba(224, 247, 255, 0.9);
            max-width: 700px;
            margin: 0 auto 50px;
            line-height: 1.6;
            font-weight: 300;
            opacity: 0;
            animation: fadeInUp 1s ease 0.5s forwards;
        }
        
        /* زر التفعيل - محوره في المنتصف */
        .activation-container {
            position: relative;
            margin: 60px auto;
            width: fit-content;
            opacity: 0;
            animation: fadeInUp 1s ease 0.7s forwards;
        }
        
        .activation-btn {
            background: linear-gradient(135deg, 
                rgba(31, 64, 104, 0.95), 
                rgba(0, 201, 255, 0.95));
            color: white;
            border: none;
            padding: 25px 60px;
            font-size: 1.6rem;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow);
            z-index: 2;
        }
        
        .activation-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 201, 255, 0.4);
        }
        
        .activation-btn:active {
            transform: translateY(-2px);
        }
        
        .btn-icon {
            font-size: 1.8rem;
            transition: var(--transition);
        }
        
        .activation-btn:hover .btn-icon {
            transform: rotate(15deg) scale(1.2);
        }
        
        .btn-text {
            position: relative;
            z-index: 1;
        }
        
        .activation-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.6s;
        }
        
        .activation-btn:hover::before {
            left: 100%;
        }
        
        /* تأثير خفيف حول الزر */
        .btn-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, 
                rgba(0, 201, 255, 0.2) 0%, 
                transparent 70%);
            border-radius: 30px;
            z-index: 1;
            opacity: 0;
            transition: var(--transition);
        }
        
        .activation-btn:hover + .btn-glow {
            opacity: 1;
        }
        
        /* المميزات - ثابتة في الأسفل */
        .features {
            position: fixed;
            bottom: 40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 0 20px;
            z-index: 100;
            opacity: 0;
            animation: fadeInUp 1s ease 0.9s forwards;
        }
        
        .feature {
            text-align: center;
            max-width: 180px;
            opacity: 0.8;
            transition: var(--transition);
        }
        
        .feature:hover {
            opacity: 1;
            transform: translateY(-5px);
        }
        
        .feature-icon {
            width: 70px;
            height: 70px;
            background: rgba(31, 64, 104, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 24px;
            color: var(--neon);
            border: 2px solid rgba(0, 201, 255, 0.3);
            transition: var(--transition);
        }
        
        .feature:hover .feature-icon {
            background: rgba(31, 64, 104, 0.8);
            border-color: var(--neon);
            transform: scale(1.1);
        }
        
        .feature-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--light);
        }
        
        .feature-desc {
            font-size: 0.85rem;
            color: rgba(224, 247, 255, 0.7);
            line-height: 1.4;
        }
        
        /* النجوم الثابتة */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: starTwinkle 3s infinite ease-in-out;
        }
        
        @keyframes starTwinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        /* الخط الرقمي الخفيف */
        .digital-line {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent, 
                var(--neon), 
                transparent);
            z-index: 1;
        }
        
        /* تصميم متجاوب - تركز كل شيء */
        @media (max-width: 1200px) {
            .hero-title {
                font-size: 3rem;
            }
            
            .activation-btn {
                padding: 22px 50px;
                font-size: 1.4rem;
            }
        }
        
        @media (max-width: 992px) {
            .main-content {
                padding: 15px;
            }
            
            .hero-title {
                font-size: 2.5rem;
            }
            
            .hero-subtitle {
                font-size: 1.1rem;
                margin-bottom: 40px;
            }
            
            .features {
                gap: 30px;
            }
            
            .feature {
                max-width: 150px;
            }
        }
        
        @media (max-width: 768px) {
            .platform-name {
                right: 30px;
                top: 30px;
            }
            
            .kr-logo {
                font-size: 2.2rem;
            }
            
            .platform-subtitle {
                font-size: 0.85rem;
                letter-spacing: 4px;
            }
            
            .hero-title {
                font-size: 2rem;
            }
            
            .hero-subtitle {
                font-size: 1rem;
                margin-bottom: 30px;
            }
            
            .activation-btn {
                padding: 18px 35px;
                font-size: 1.2rem;
                flex-direction: column;
                gap: 10px;
            }
            
            .btn-icon {
                font-size: 1.5rem;
            }
            
            .features {
                bottom: 30px;
                gap: 20px;
                flex-wrap: wrap;
            }
            
            .feature {
                max-width: 130px;
            }
            
            .feature-icon {
                width: 60px;
                height: 60px;
                font-size: 20px;
            }
        }
        
        @media (max-width: 576px) {
            .platform-name {
                right: 20px;
                top: 20px;
                text-align: center;
            }
            
            .kr-logo {
                font-size: 1.8rem;
            }
            
            .platform-subtitle {
                font-size: 0.75rem;
                letter-spacing: 3px;
            }
            
            .hero-title {
                font-size: 1.8rem;
            }
            
            .hero-subtitle {
                font-size: 0.9rem;
                margin-bottom: 25px;
            }
            
            .activation-btn {
                padding: 16px 25px;
                font-size: 1rem;
            }
            
            .features {
                position: relative;
                bottom: auto;
                margin-top: 50px;
                gap: 15px;
            }
            
            .feature {
                max-width: 100px;
            }
            
            .feature-title {
                font-size: 0.9rem;
            }
            
            .feature-desc {
                font-size: 0.75rem;
            }
        }
        
        @media (max-width: 400px) {
            .hero-title {
                font-size: 1.5rem;
            }
            
            .activation-btn {
                padding: 14px 20px;
                font-size: 0.9rem;
            }
            
            .features {
                gap: 10px;
            }
            
            .feature {
                max-width: 90px;
            }
        }
        
        /* ضمان أن المحتوى في المنتصف للجميع */
        @media (max-height: 700px) {
            .main-content {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                margin: 100px auto 50px;
            }
            
            .features {
                position: relative;
                bottom: auto;
                margin-top: 50px;
            }
        }
    </style>
</head>
<body>
    <!-- الخلفية الثابتة -->
    <div class="background"></div>
    <div class="grid-overlay"></div>
    
    <!-- النجوم -->
    <div class="stars" id="stars"></div>
    
    <!-- الخط الرقمي -->
    <div class="digital-line"></div>
    
    <!-- اسم المنصة -->
    <div class="platform-name">
        <div class="kr-logo">KR</div>
        <div class="platform-subtitle">المنصة الرقمية</div>
    </div>
    
    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <h1 class="hero-title">هويتك الرقمية الموحدة</h1>
        
        <p class="hero-subtitle">
            بوابة رقمية متكاملة تمنحك هوية موحدة لجميع الخدمات
            <br>
            بتقنيات أمان متقدمة وتجربة مستخدم سلسة
        </p>
        
        <!-- زر التفعيل -->
        <div class="activation-container">
            <button class="activation-btn" id="activateBtn">
                <i class="fas fa-fingerprint btn-icon"></i>
                <span class="btn-text">تفعيل الهوية الرقمية</span>
            </button>
            <div class="btn-glow"></div>
        </div>
        
        <!-- المميزات -->
        <div class="features">
            <div class="feature">
                <div class="feature-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h3 class="feature-title">آمنة</h3>
                <p class="feature-desc">تشفير متقدم لحماية بياناتك</p>
            </div>
            
            <div class="feature">
                <div class="feature-icon">
                    <i class="fas fa-bolt"></i>
                </div>
                <h3 class="feature-title">سريعة</h3>
                <p class="feature-desc">تفعيل فوري في دقائق</p>
            </div>
            
            <div class="feature">
                <div class="feature-icon">
                    <i class="fas fa-link"></i>
                </div>
                <h3 class="feature-title">موحدة</h3>
                <p class="feature-desc">وصول لجميع الخدمات</p>
            </div>
            
            <div class="feature">
                <div class="feature-icon">
                    <i class="fas fa-mobile-alt"></i>
                </div>
                <h3 class="feature-title">ذكية</h3>
                <p class="feature-desc">توافق مع جميع الأجهزة</p>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // إنشاء النجوم
            function createStars() {
                const starsContainer = document.getElementById('stars');
                const starCount = 100;
                
                for (let i = 0; i < starCount; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    
                    // حجم عشوائي
                    const size = Math.random() * 3;
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';
                    
                    // موقع عشوائي
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    
                    // تأخير عشوائي للوميض
                    star.style.animationDelay = Math.random() * 3 + 's';
                    
                    starsContainer.appendChild(star);
                }
            }
            
            createStars();
            
            // زر التفعيل
            const activateBtn = document.getElementById('activateBtn');
            
            activateBtn.addEventListener('click', function() {
                // تأثير بسيط عند النقر
                this.style.transform = 'scale(0.95)';
                
                // إنشاء تأثير تموج
                const ripple = document.createElement('div');
                ripple.style.cssText = `
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    width: 100%;
                    height: 100%;
                    background: radial-gradient(circle, rgba(0,201,255,0.3) 0%, transparent 70%);
                    border-radius: 20px;
                    transform: translate(-50%, -50%) scale(0);
                    animation: rippleEffect 0.6s ease-out forwards;
                    z-index: 0;
                `;
                
                // إضافة أنيميشن للتموج
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes rippleEffect {
                        to {
                            transform: translate(-50%, -50%) scale(2);
                            opacity: 0;
                        }
                    }
                `;
                document.head.appendChild(style);
                
                this.appendChild(ripple);
                
                // إزالة التموج بعد الأنيميشن
                setTimeout(() => {
                    ripple.remove();
                }, 600);
                
                // إعادة الزر لحالته الطبيعية
                setTimeout(() => {
                    this.style.transform = 'translateY(-5px)';
                }, 200);
                
                // عرض رسالة التفعيل
                setTimeout(() => {
                    showActivationModal();
                }, 400);
            });
            
            // عرض نافذة التفعيل
            function showActivationModal() {
                const modal = document.createElement('div');
                modal.innerHTML = `
                    <div style="
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        background: rgba(12, 21, 40, 0.95);
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        z-index: 2000;
                        animation: modalFadeIn 0.3s ease;
                    ">
                        <div style="
                            background: linear-gradient(135deg, rgba(22, 36, 71, 0.95), rgba(31, 64, 104, 0.95));
                            border-radius: 20px;
                            padding: 40px;
                            max-width: 500px;
                            width: 90%;
                            text-align: center;
                            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
                            border: 1px solid rgba(0, 201, 255, 0.3);
                            animation: modalSlideUp 0.4s ease;
                        ">
                            <i class="fas fa-check-circle" style="
                                font-size: 3.5rem;
                                color: var(--neon);
                                margin-bottom: 20px;
                                display: block;
                            "></i>
                            
                            <h2 style="
                                color: white;
                                font-size: 1.8rem;
                                margin-bottom: 15px;
                                background: linear-gradient(135deg, var(--light), var(--neon));
                                -webkit-background-clip: text;
                                background-clip: text;
                                color: transparent;
                            ">تم استلام طلبك</h2>
                            
                            <p style="
                                color: rgba(224, 247, 255, 0.9);
                                line-height: 1.6;
                                margin-bottom: 25px;
                                font-size: 1.1rem;
                            ">
                                تم تسجيل طلب تفعيل الهوية الرقمية بنجاح
                                <br>
                                <span style="color: var(--neon); font-weight: bold;">رقم الطلب: KR${Math.floor(1000 + Math.random() * 9000)}</span>
                            </p>
                            
                            <div style="
                                background: rgba(0, 201, 255, 0.1);
                                padding: 15px;
                                border-radius: 10px;
                                margin-bottom: 25px;
                                text-align: right;
                            ">
                                <p style="color: rgba(224, 247, 255, 0.8); margin-bottom: 5px; font-size: 0.9rem;">
                                    <i class="fas fa-clock" style="margin-left: 8px;"></i>
                                    مدة المراجعة: 24-48 ساعة
                                </p>
                                <p style="color: rgba(224, 247, 255, 0.8); font-size: 0.9rem;">
                                    <i class="fas fa-envelope" style="margin-left: 8px;"></i>
                                    سيتم الإشعار عبر البريد الإلكتروني
                                </p>
                            </div>
                            
                            <button onclick="this.closest('div[style*=\"position: fixed\"]').remove()" style="
                                background: linear-gradient(135deg, var(--neon), var(--accent));
                                color: white;
                                border: none;
                                padding: 12px 40px;
                                font-size: 1rem;
                                font-weight: 600;
                                border-radius: 10px;
                                cursor: pointer;
                                transition: all 0.3s;
                                margin-top: 10px;
                            ">تم</button>
                        </div>
                    </div>
                `;
                
                // إضافة أنيميشن للنافذة
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes modalFadeIn {
                        from { opacity: 0; }
                        to { opacity: 1; }
                    }
                    
                    @keyframes modalSlideUp {
                        from { 
                            opacity: 0;
                            transform: translateY(30px);
                        }
                        to { 
                            opacity: 1;
                            transform: translateY(0);
                        }
                    }
                `;
                document.head.appendChild(style);
                
                document.body.appendChild(modal);
            }
            
            // إضافة تأثير خفيف للمميزات
            const features = document.querySelectorAll('.feature');
            features.forEach(feature => {
                feature.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-8px)';
                });
                
                feature.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0)';
                });
            });
            
            // ضبط الموقع للشاشات الصغيرة
            function adjustLayout() {
                const mainContent = document.querySelector('.main-content');
                const features = document.querySelector('.features');
                
                if (window.innerHeight < 700) {
                    mainContent.style.position = 'relative';
                    mainContent.style.top = 'auto';
                    mainContent.style.left = 'auto';
                    mainContent.style.transform = 'none';
                    mainContent.style.margin = '100px auto 50px';
                    
                    features.style.position = 'relative';
                    features.style.bottom = 'auto';
                    features.style.marginTop = '50px';
                } else {
                    mainContent.style.position = 'absolute';
                    mainContent.style.top = '50%';
                    mainContent.style.left = '50%';
                    mainContent.style.transform = 'translate(-50%, -50%)';
                    mainContent.style.margin = '0';
                    
                    features.style.position = 'fixed';
                    features.style.bottom = '40px';
                    features.style.marginTop = '0';
                }
            }
            
            // استدعاء عند تحميل الصفحة وعند تغيير حجم النافذة
            adjustLayout();
            window.addEventListener('resize', adjustLayout);
        });
    </script>
</body>
</html>
