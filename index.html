<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هيئة KR</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-id-card"></i>
                <h1>هيئة KR الرقمية</h1>
            </div>
        </header>

        <main class="form-box">
            <!-- الخطوة 1 -->
            <div class="form-step active" id="step1">
                <h2>البيانات الأساسية</h2>
                
                <div class="input-field">
                    <i class="fas fa-user"></i>
                    <input type="text" id="fullName" placeholder="الاسم الكامل">
                </div>
                
                <div class="input-field">
                    <i class="fas fa-birthday-cake"></i>
                    <input type="number" id="age" placeholder="العمر (18+)">
                </div>
                
                <div class="input-field">
                    <i class="fab fa-discord"></i>
                    <input type="text" id="discord" placeholder="اسمك في الديسكورد">
                </div>
                
                <div class="input-field">
                    <i class="fas fa-id-card"></i>
                    <input type="text" id="nationalId" placeholder="رقم الهوية (10 أرقام فقط)">
                </div>
                
                <button class="btn next-btn" onclick="goToStep(2)">التالي</button>
            </div>

            <!-- الخطوة 2 -->
            <div class="form-step" id="step2">
                <h2>اختيار الوظيفة</h2>
                
                <div class="options">
                    <div class="option" onclick="selectJob('citizen')">
                        <i class="fas fa-user-tie"></i>
                        <span>مواطن</span>
                    </div>
                    
                    <div class="option" onclick="selectJob('interior')">
                        <i class="fas fa-shield-alt"></i>
                        <span>منسوب الداخلية</span>
                    </div>
                </div>
                
                <div class="btn-group">
                    <button class="btn prev-btn" onclick="goToStep(1)">السابق</button>
                    <button class="btn next-btn" onclick="goToStep(3)">التالي</button>
                </div>
            </div>

            <!-- الخطوة 3 -->
            <div class="form-step" id="step3">
                <h2>رفع صورة الهوية</h2>
                
                <div class="upload-area" onclick="uploadFile()">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>اضغط لرفع صورة هوية اللعبة</p>
                    <input type="file" id="idImage" accept="image/*" hidden>
                </div>
                
                <div class="file-info" id="fileInfo">لم يتم رفع أي صورة</div>
                
                <div class="example">
                    <p><strong>مثال على الهوية الصحيحة:</strong></p>
                    <img src="https://image2url.com/r2/default/images/1769695282320-2ade9dfa-ea7d-4f34-b1f5-81fd757f4464.jpeg" alt="مثال" width="100%">
                </div>
                
                <div class="btn-group">
                    <button class="btn prev-btn" onclick="goToStep(2)">السابق</button>
                    <button class="btn submit-btn" onclick="submitForm()">إرسال الطلب</button>
                </div>
            </div>

            <!-- رسالة النجاح -->
            <div class="success" id="success" style="display:none">
                <i class="fas fa-check-circle"></i>
                <h3>تم الإرسال بنجاح!</h3>
                <button class="btn" onclick="resetForm()">طلب جديد</button>
            </div>
        </main>
    </div>

    <!-- مكان ظهور التحذيرات -->
    <div class="error-box" id="errorBox"></div>

    <script src="script.js"></script>
</body>
</html>
