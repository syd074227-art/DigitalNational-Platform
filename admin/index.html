<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الإدارة الفاخرة - نظام تفعيل الهويات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== متغيرات التصميم الفاخر ===== */
        :root {
            --primary: #1e3a8a;
            --primary-dark: #0f2a6d;
            --primary-light: #3b82f6;
            --secondary: #8b5cf6;
            --accent: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --info: #0ea5e9;
            --gold: #d4af37;
            --silver: #c0c0c0;
            --dark: #0f172a;
            --darker: #1e293b;
            --light: #f8fafc;
            --gradient: linear-gradient(135deg, #1e3a8a 0%, #2d68c4 50%, #0f172a 100%);
            --gradient-gold: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
            --gradient-purple: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            --shadow: 0 20px 60px rgba(0,0,0,0.3);
            --glow: 0 0 50px rgba(30, 58, 138, 0.4);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.1);
        }

        /* ===== إعادة التعيين والإعدادات العامة ===== */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: var(--light);
            position: relative;
            overflow-x: hidden;
        }

        /* ===== خلفية أنيقة متحركة ===== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.1;
        }

        .shape {
            position: absolute;
            background: var(--gold);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        .shape:nth-child(1) { width: 300px; height: 300px; top: -150px; right: -150px; animation-duration: 25s; }
        .shape:nth-child(2) { width: 200px; height: 200px; bottom: -100px; left: -100px; animation-duration: 20s; animation-delay: 2s; }
        .shape:nth-child(3) { width: 150px; height: 150px; top: 50%; left: 10%; animation-duration: 30s; animation-delay: 1s; }

        /* ===== الهيدر الفاخر ===== */
        .dashboard-header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 15px 30px;
            animation: slideDown 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 5px 30px rgba(0,0,0,0.2);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ===== الشعار الفاخر ===== */
        .logo {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: var(--gradient);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: logoFloat 6s ease-in-out infinite;
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.3);
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: var(--gradient);
            border-radius: 17px;
            z-index: -1;
            opacity: 0.5;
            animation: logoPulse 3s ease-in-out infinite;
        }

        .logo-icon i {
            font-size: 28px;
            color: white;
            animation: iconSpin 20s linear infinite;
        }

        .logo-text h1 {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, white, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .logo-text p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 1px;
        }

        /* ===== شريط أدوات الأعلى ===== */
        .top-tools {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        /* ===== بريد المسؤول ===== */
        .admin-mail {
            position: relative;
        }

        .mail-btn {
            background: var(--gradient);
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .mail-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.7s;
        }

        .mail-btn:hover::before {
            left: 100%;
        }

        .mail-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.3);
        }

        .mail-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            animation: badgePulse 2s infinite;
        }

        /* ===== قائمة المستخدم ===== */
        .user-menu {
            position: relative;
        }

        .user-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .user-btn:hover {
            background: var(--glass-hover);
            transform: translateY(-2px);
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background: var(--gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 20px;
            position: relative;
        }

        .user-avatar::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: var(--gradient);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.5;
            animation: avatarPulse 3s infinite;
        }

        .user-details {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: 700;
            font-size: 14px;
            color: white;
        }

        .user-role {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* ===== القائمة المنسدلة ===== */
        .dropdown-menu {
            position: absolute;
            top: 70px;
            left: 0;
            background: var(--glass);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            width: 280px;
            display: none;
            overflow: hidden;
            animation: slideDown 0.3s ease;
            box-shadow: var(--shadow);
            z-index: 1001;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-header {
            padding: 25px;
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.5), rgba(59, 130, 246, 0.3));
            border-bottom: 1px solid var(--glass-border);
            text-align: center;
        }

        .dropdown-header h4 {
            color: white;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .dropdown-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
        }

        .dropdown-items {
            padding: 15px 0;
        }

        .dropdown-item {
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
        }

        .dropdown-item:hover {
            background: var(--glass-hover);
            color: white;
            padding-right: 30px;
        }

        .dropdown-item i {
            width: 20px;
            color: var(--gold);
            font-size: 18px;
        }

        .dropdown-item.logout {
            color: #f87171;
            border-top: 1px solid var(--glass-border);
            margin-top: 10px;
            padding-top: 20px;
        }

        .dropdown-item.logout:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* ===== المحتوى الرئيسي ===== */
        .dashboard-content {
            padding: 120px 30px 100px;
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* ===== بحث فاخر ===== */
        .hero-search {
            background: var(--gradient);
            border-radius: 25px;
            padding: 40px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow);
        }

        .hero-search::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70%);
            animation: shine 3s infinite;
        }

        .search-container {
            position: relative;
            z-index: 2;
        }

        .search-title {
            color: white;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 700;
        }

        .search-box {
            display: flex;
            gap: 15px;
        }

        .search-input {
            flex: 1;
            padding: 20px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: white;
            font-size: 16px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-btn {
            background: var(--gradient-gold);
            border: none;
            padding: 0 40px;
            border-radius: 15px;
            color: var(--dark);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }

        .search-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.4);
        }

        /* ===== بطاقات الإحصائيات الفاخرة ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .stat-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 35px 30px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s;
            cursor: pointer;
            animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }
        .stat-card:nth-child(4) { animation-delay: 0.4s; }

        .stat-card:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: var(--gold);
            box-shadow: var(--shadow), var(--glow);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), transparent);
            transform: translateY(100%);
            transition: transform 0.6s;
        }

        .stat-card:hover::before {
            transform: translateY(0);
        }

        .stat-icon {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            font-size: 32px;
            position: relative;
            z-index: 2;
            animation: iconFloat 4s ease-in-out infinite;
        }

        .stat-card:nth-child(1) .stat-icon { 
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(30, 58, 138, 0.3)); 
            color: #60a5fa; 
        }
        .stat-card:nth-child(2) .stat-icon { 
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(217, 119, 6, 0.3)); 
            color: #fbbf24; 
        }
        .stat-card:nth-child(3) .stat-icon { 
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.2), rgba(4, 120, 87, 0.3)); 
            color: #34d399; 
        }
        .stat-card:nth-child(4) .stat-icon { 
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(99, 102, 241, 0.3)); 
            color: #a78bfa; 
        }

        .stat-number {
            font-size: 48px;
            font-weight: 900;
            margin: 10px 0;
            background: linear-gradient(135deg, white, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            z-index: 2;
        }

        .stat-title {
            color: rgba(255, 255, 255, 0.9);
            font-size: 18px;
            font-weight: 600;
            position: relative;
            z-index: 2;
        }

        .stat-trend {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            position: relative;
            z-index: 2;
        }

        /* ===== أقسام التحكم ===== */
        .control-section {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            overflow: hidden;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .section-header {
            padding: 30px 35px;
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.4), rgba(59, 130, 246, 0.3));
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 20px;
            color: white;
            font-size: 22px;
            font-weight: 700;
        }

        .section-title i {
            color: var(--gold);
            font-size: 26px;
        }

        /* ===== أدوات التحكم الفاخرة ===== */
        .control-tools {
            padding: 30px 35px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .filters {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .filter-select {
            padding: 16px 25px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            color: white;
            min-width: 200px;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            font-size: 15px;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .filter-select option {
            background: var(--darker);
            color: white;
        }

        /* ===== الأزرار الفاخرة ===== */
        .btn {
            padding: 18px 35px;
            border: none;
            border-radius: 15px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.7s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: var(--gradient-gold);
            color: var(--dark);
        }

        .btn-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.4);
        }

        .btn-secondary {
            background: var(--glass);
            color: white;
            border: 2px solid var(--glass-border);
        }

        .btn-secondary:hover {
            background: var(--glass-hover);
            border-color: var(--gold);
            transform: translateY(-5px);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--accent), #10b981);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #ef4444);
            color: white;
        }

        .btn-info {
            background: linear-gradient(135deg, var(--info), #0ea5e9);
            color: white;
        }

        .btn-purple {
            background: var(--gradient-purple);
            color: white;
        }

        /* ===== جدول الطلبات الفاخر ===== */
        .requests-table-container {
            overflow-x: auto;
            border-radius: 20px;
            margin: 20px 35px 35px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
        }

        .requests-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        .requests-table th {
            padding: 22px 25px;
            text-align: right;
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.6), rgba(59, 130, 246, 0.4));
            color: white;
            font-weight: 700;
            font-size: 16px;
            border-bottom: 2px solid var(--glass-border);
            white-space: nowrap;
            position: sticky;
            top: 0;
        }

        .requests-table td {
            padding: 20px 25px;
            border-bottom: 1px solid var(--glass-border);
            color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s;
        }

        .requests-table tbody tr {
            transition: all 0.3s;
        }

        .requests-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* ===== علامات الحالة الفاخرة ===== */
        .status-badge {
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 700;
            display: inline-block;
            position: relative;
            overflow: hidden;
        }

        .status-badge::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: translateX(-100%);
            animation: shine 2s infinite;
        }

        .status-pending {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.3), rgba(217, 119, 6, 0.4));
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .status-approved {
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.3), rgba(4, 120, 87, 0.4));
            color: #34d399;
            border: 1px solid rgba(5, 150, 105, 0.4);
        }

        .status-rejected {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.3), rgba(220, 38, 38, 0.4));
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        /* ===== أزرار الإجراءات الفاخرة ===== */
        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .action-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            color: white;
            font-size: 16px;
            position: relative;
            overflow: hidden;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.7s;
        }

        .action-btn:hover::before {
            left: 100%;
        }

        .action-btn:hover {
            transform: translateY(-3px) scale(1.1);
        }

        .btn-view {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(30, 58, 138, 0.4));
        }

        .btn-approve {
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.3), rgba(4, 120, 87, 0.4));
        }

        .btn-reject {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.3), rgba(220, 38, 38, 0.4));
        }

        /* ===== الشريط السفلي الفاخر ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(30px);
            border-top: 1px solid var(--glass-border);
            z-index: 1000;
            padding: 15px 30px;
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -5px 30px rgba(0,0,0,0.2);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1600px;
            margin: 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 15px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .nav-item:hover {
            color: white;
            background: var(--glass-hover);
            transform: translateY(-5px);
        }

        .nav-item.active {
            color: var(--gold);
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(255, 215, 0, 0.05));
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            top: -5px;
            width: 30px;
            height: 3px;
            background: var(--gold);
            border-radius: 2px;
            animation: navPulse 2s infinite;
        }

        .nav-icon {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .nav-label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ===== نافذة البريد الفاخرة ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.4s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        .mail-modal {
            background: var(--glass);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow: hidden;
            animation: modalAppear 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow);
        }

        .mail-header {
            padding: 30px 35px;
            background: var(--gradient-purple);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mail-header h3 {
            color: white;
            font-size: 24px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .mail-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 15px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mail-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        .mail-body {
            padding: 35px;
        }

        /* ===== نموذج البريد الفاخر ===== */
        .mail-form {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .form-group {
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-label i {
            color: var(--gold);
        }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 18px 25px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            color: white;
            font-size: 16px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
        }

        .form-textarea {
            min-height: 150px;
            resize: vertical;
        }

        .form-select {
            cursor: pointer;
        }

        .recipient-info {
            background: rgba(30, 58, 138, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-top: 10px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .recipient-info.show {
            display: block;
        }

            backdrop-filter: blur(30px);
