<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة طلبات KR - الإدارة العليا</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        /* نفس نظام الألوان (Variable) اللي في كودك بالضبط */
        :root {
            --primary: #1a237e;
            --accent: #ff6f00;
            --accent-light: #ff9800;
            --dark: #0d1117;
            --glass-dark: rgba(0, 0, 0, 0.3);
            --border: rgba(255, 255, 255, 0.1);
            --gradient-dark: linear-gradient(135deg, #0d1117 0%, #1a237e 50%, #0d1117 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Cairo', sans-serif; }
        
        body { background: var(--gradient-dark); color: white; min-height: 100vh; padding: 20px; }

        .admin-container { max-width: 1200px; margin: auto; position: relative; z-index: 1; }

        .header { 
            background: var(--glass-dark); backdrop-filter: blur(20px);
            padding: 30px; border-radius: 24px; text-align: center;
            border: 1px solid var(--border); border-bottom: 4px solid var(--accent);
            margin-bottom: 30px;
        }

        .order-card {
            background: var(--glass-dark); backdrop-filter: blur(20px);
            border-radius: 20px; padding: 25px; margin-bottom: 25px;
            border: 1px solid var(--border); transition: 0.3s;
        }

        .order-card:hover { border-color: var(--accent); transform: translateY(-5px); }

        .grid-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }

        .info-item { margin-bottom: 10px; font-size: 15px; }
        .info-item strong { color: var(--accent-light); margin-left: 5px; }

        .images-flex { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .img-wrapper { flex: 1; min-width: 250px; text-align: center; }
        .img-wrapper p { font-size: 13px; color: #8b949e; margin-bottom: 8px; }
        .img-wrapper img { 
            width: 100%; height: 180px; object-fit: cover; 
            border-radius: 12px; border: 2px solid var(--border);
            cursor: pointer; transition: 0.3s;
        }
        .img-wrapper img:hover { border-color: var(--accent); scale: 1.02; }

        .actions { display: flex; gap: 10px; margin-top: 25px; border-top: 1px solid var(--border); padding-top: 20px; }
        
        .btn { 
            padding: 12px 25px; border-radius: 10px; border: none; 
            cursor: pointer; font-weight: bold; flex: 1; transition: 0.3s;
        }
        .btn-accept { background: #00c853; color: white; }
        .btn-reject { background: #d50000; color: white; }
        .btn-delete { background: #333; color: white; flex: 0.5; }
        .btn:hover { opacity: 0.8; transform: scale(1.05); }

        .badge-dept { background: var(--primary); color: white; padding: 4px 10px; border-radius: 5px; font-size: 12px; }
        .status-tag { float: left; padding: 5px 15px; border-radius: 50px; font-size: 12px; font-weight: bold; }
        .status-pending { background: #ffd600; color: black; }
        .status-accepted { background: #00c853; color: white; }

    </style>
</head>
<body>

    <div class="admin-container">
        <div class="header">
            <h1 style="font-size: 28px; color: white;">لوحة التحكم KR OFFICIAL</h1>
            <p style="color: var(--accent);">إدارة طلبات الهوية الرقمية المرفوعة</p>
        </div>

        <div id="ordersList">
            </div>
    </div>

<script>
    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
        databaseURL: "https://myproject-7439e-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // جلب البيانات
    db.ref('orders').on('value', (snapshot) => {
        const container = document.getElementById('ordersList');
        container.innerHTML = '';
        const data = snapshot.val();

        if (!data) {
            container.innerHTML = '<div style="text-align:center; padding:50px;">لا توجد طلبات حالياً</div>';
            return;
        }

        // عرض الطلبات (الأحدث أولاً)
        Object.keys(data).reverse().forEach(id => {
            const order = data[id];
            const statusClass = order.status === 'accepted' ? 'status-accepted' : 'status-pending';
            const statusText = order.status === 'accepted' ? 'مقبول ✓' : 'قيد الانتظار ⏱';

            const card = `
                <div class="order-card">
                    <span class="status-tag ${statusClass}">${statusText}</span>
                    <div style="color:var(--accent); margin-bottom:15px;"># ${order.id}</div>
                    
                    <div class="grid-info">
                        <div>
                            <div class="info-item"><strong><i class="fas fa-user"></i> الاسم:</strong> ${order.fullName}</div>
                            <div class="info-item"><strong><i class="fas fa-calendar"></i> العمر:</strong> ${order.age}</div>
                            <div class="info-item"><strong><i class="fas fa-fingerprint"></i> رقم الهوية:</strong> ${order.gameId}</div>
                        </div>
                        <div>
                            <div class="info-item"><strong><i class="fas fa-gamepad"></i> يوزر اللعبة:</strong> ${order.gameUsername}</div>
                            <div class="info-item"><strong><i class="fab fa-discord"></i> ديسكورد:</strong> ${order.discordUsername}</div>
                            <div class="info-item"><strong><i class="fas fa-building"></i> الجهة:</strong> <span class="badge-dept">${order.departmentName}</span></div>
                        </div>
                        <div>
                            <div class="info-item"><strong><i class="fas fa-medal"></i> الرتبة:</strong> ${order.rank || 'غير محدد'}</div>
                            <div class="info-item"><strong><i class="fas fa-briefcase"></i> المناصب:</strong> ${order.additionals ? order.additionals.join(' • ') : 'لا يوجد'}</div>
                            <div class="info-item"><strong><i class="fas fa-clock"></i> التاريخ:</strong> ${order.date}</div>
                        </div>
                    </div>

                    <div class="images-flex">
                        <div class="img-wrapper">
                            <p>صورة الهوية الوطنية</p>
                            <img src="${order.nationalIdImage}" onclick="window.open(this.src)">
                        </div>
                        <div class="img-wrapper">
                            <p>صورة الشخصية</p>
                            <img src="${order.characterImage}" onclick="window.open(this.src)">
                        </div>
                    </div>

                    <div class="actions">
                        <button class="btn btn-accept" onclick="updateStatus('${id}', 'accepted')">قـبول التفعيل</button>
                        <button class="btn btn-reject" onclick="updateStatus('${id}', 'rejected')">رفـض الطلب</button>
                        <button class="btn btn-delete" onclick="deleteOrder('${id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `;
            container.innerHTML += card;
        });
    });

    // تحديث الحالة (مقبول/مرفوض)
    function updateStatus(id, newStatus) {
        db.ref('orders/' + id).update({ status: newStatus })
        .then(() => alert('تم تحديث الحالة بنجاح'));
    }

    // حذف الطلب
    function deleteOrder(id) {
        if(confirm('هل أنت متأكد من حذف هذا السجل نهائياً؟')) {
            db.ref('orders/' + id).remove();
        }
    }
</script>
</body>
</html>
