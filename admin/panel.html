<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة المتطورة - KR System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Cairo', sans-serif; }
        body { background: linear-gradient(135deg, #0d1117 0%, #1a237e 100%); min-height: 100vh; color: white; overflow-x: hidden; }

        .sidebar { position: fixed; right: 0; top: 0; width: 280px; height: 100vh; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); border-left: 1px solid rgba(255, 255, 255, 0.1); padding: 30px 20px; z-index: 1000; }
        .logo-section { text-align: center; margin-bottom: 40px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 20px; }
        .logo-section i { font-size: 50px; color: #ff6f00; }
        
        .menu-item { padding: 12px 15px; margin-bottom: 8px; border-radius: 12px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 12px; color: #c9d1d9; }
        .menu-item:hover, .menu-item.active { background: linear-gradient(135deg, #ff6f00, #ff9800); color: white; }

        .main-content { margin-right: 280px; padding: 30px; }
        .header-card { background: rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 30px; margin-bottom: 30px; border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .stat-box { background: rgba(0, 0, 0, 0.3); padding: 20px; border-radius: 15px; text-align: center; border-bottom: 3px solid #ff6f00; }
        .stat-number { font-size: 30px; font-weight: bold; color: #ff6f00; }

        .requests-grid { display: grid; gap: 20px; }
        .request-card { background: rgba(255, 255, 255, 0.07); border-radius: 15px; padding: 25px; border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s; position: relative; }
        .request-card:hover { transform: translateY(-5px); border-color: #ff6f00; }
        
        /* 🎯 إشعار الطلب الجديد */
        .request-card.new-request {
            animation: newRequestPulse 2s ease-in-out;
            border: 2px solid #00c853;
            box-shadow: 0 0 30px rgba(0, 200, 83, 0.4);
        }
        
        @keyframes newRequestPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(0, 200, 83, 0.4); }
            50% { box-shadow: 0 0 50px rgba(0, 200, 83, 0.7); }
        }
        
        .new-badge {
            position: absolute;
            top: -10px;
            left: -10px;
            background: linear-gradient(135deg, #00c853, #00e676);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            animation: badgeBounce 0.5s ease-in-out;
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.5);
        }
        
        @keyframes badgeBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .user-meta h2 { color: #ff9800; font-size: 22px; }
        
        .image-preview-group { display: flex; gap: 10px; }
        .thumb-img { width: 80px; height: 80px; border-radius: 10px; object-fit: cover; cursor: pointer; border: 2px solid rgba(255,255,255,0.1); }

        .details-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; }
        .detail-item span { display: block; font-size: 12px; color: #8b949e; }
        .detail-item b { font-size: 14px; }

        .actions { margin-top: 20px; display: flex; gap: 15px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
        .btn-accept { background: #00c853; color: white; }
        .btn-reject { background: #d50000; color: white; }
        .btn:hover { opacity: 0.8; transform: scale(1.02); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content img { max-width: 90%; max-height: 80vh; border-radius: 10px; }

        /* 🔔 إشعار صوتي */
        .notification-popup {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, #00c853, #00e676);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 200, 83, 0.5);
            z-index: 9999;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        .notification-popup.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

<div id="notificationPopup" class="notification-popup">
    <i class="fas fa-bell" style="margin-left: 10px;"></i>
    <strong>طلب تفعيل جديد!</strong>
</div>

<div class="sidebar">
    <div class="logo-section">
        <i class="fas fa-user-shield"></i>
        <h2>KR ADMIN</h2>
        <p>نظام إدارة الهويات</p>
    </div>
    <div class="menu-item active" onclick="showPage('requests')">
        <i class="fas fa-list"></i> <span>طلبات التفعيل</span>
    </div>
    <div class="menu-item" onclick="showPage('ids')">
        <i class="fas fa-id-card"></i> <span>الهويات الصادرة</span>
    </div>
    <div class="menu-item" onclick="location.reload()">
        <i class="fas fa-sync"></i> <span>تحديث البيانات</span>
    </div>
</div>

<div class="main-content">
    <div id="requestsPage" class="page">
        <div class="header-card">
            <h1><i class="fas fa-bell"></i> طلبات التفعيل الواردة</h1>
            <div class="stats-grid">
                <div class="stat-box"><div class="stat-number" id="count-pending">0</div><div class="stat-label">قيد الانتظار</div></div>
                <div class="stat-box"><div class="stat-number" id="count-accepted" style="color:#00c853">0</div><div class="stat-label">تم قبولها</div></div>
                <div class="stat-box"><div class="stat-number" id="count-rejected" style="color:#d50000">0</div><div class="stat-label">تم رفضها</div></div>
            </div>
        </div>
        <div class="requests-grid" id="requestsContainer"></div>
    </div>

    <div id="idsPage" class="page" style="display:none">
        <div class="header-card">
            <h1><i class="fas fa-id-badge"></i> سجل الهويات الرقمية</h1>
            <p>قائمة بجميع المواطنين الذين تم تفعيل هوياتهم في النظام.</p>
        </div>
        <div class="requests-grid" id="idsContainer"></div>
    </div>
</div>

<div id="imageModal" class="modal" onclick="this.classList.remove('active')">
    <div class="modal-content"><img id="fullImage" src=""></div>
</div>

<script>
    let lastRequestCount = 0;
    
    // ✅ تحميل البيانات
    function loadData() {
        const requests = JSON.parse(localStorage.getItem('admin_pending_requests') || '[]');
        
        // 🔔 التحقق من وجود طلبات جديدة
        const currentPendingCount = requests.filter(r => r.status === 'pending').length;
        if (currentPendingCount > lastRequestCount) {
            showNewRequestNotification();
            playNotificationSound();
        }
        lastRequestCount = currentPendingCount;
        
        updateStats(requests);
        renderRequests(requests);
        renderIDs(requests.filter(r => r.status === 'accepted'));
    }

    function updateStats(data) {
        document.getElementById('count-pending').textContent = data.filter(r => r.status === 'pending').length;
        document.getElementById('count-accepted').textContent = data.filter(r => r.status === 'accepted').length;
        document.getElementById('count-rejected').textContent = data.filter(r => r.status === 'rejected').length;
    }

    function renderRequests(data) {
        const container = document.getElementById('requestsContainer');
        const pending = data.filter(r => r.status === 'pending');
        
        if(pending.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:50px; opacity:0.5"><i class="fas fa-inbox" style="font-size:60px; margin-bottom:20px; display:block;"></i>لا توجد طلبات جديدة حالياً</div>';
            return;
        }

        container.innerHTML = pending.map((req, index) => `
            <div class="request-card ${index === 0 ? 'new-request' : ''}">
                ${index === 0 ? '<div class="new-badge"><i class="fas fa-star"></i> جديد</div>' : ''}
                <div class="card-header">
                    <div class="user-meta">
                        <h2>${req.fullName}</h2>
                        <p><i class="fab fa-discord"></i> ${req.discordUsername}</p>
                    </div>
                    <div class="image-preview-group">
                        <img src="${req.nationalIdImage?.data}" class="thumb-img" onclick="openImg('${req.nationalIdImage?.data}')" title="صورة الهوية">
                        <img src="${req.characterImage?.data}" class="thumb-img" onclick="openImg('${req.characterImage?.data}')" title="صورة الشخصية">
                    </div>
                </div>
                <div class="details-list">
                    <div class="detail-item"><span>رقم الهوية</span><b>${req.gameId}</b></div>
                    <div class="detail-item"><span>اسم اللعبة</span><b>${req.gameUsername}</b></div>
                    <div class="detail-item"><span>العمر</span><b>${req.age} سنة</b></div>
                    <div class="detail-item"><span>التصنيف</span><b>${req.departmentName}</b></div>
                    <div class="detail-item"><span>الرتبة</span><b>${req.rank}</b></div>
                    <div class="detail-item"><span>التاريخ</span><b>${req.date}</b></div>
                </div>
                <div class="actions">
                    <button class="btn btn-accept" onclick="processRequest('${req.id}', 'accepted')">
                        <i class="fas fa-check"></i> قبول وتفعيل
                    </button>
                    <button class="btn btn-reject" onclick="processRequest('${req.id}', 'rejected')">
                        <i class="fas fa-times"></i> رفض الطلب
                    </button>
                </div>
            </div>
        `).join('');
    }

    // ✅ قبول/رفض الطلب
    function processRequest(id, newStatus) {
        if(!confirm(`هل أنت متأكد من ${newStatus === 'accepted' ? 'قبول' : 'رفض'} الطلب؟`)) return;

        let requests = JSON.parse(localStorage.getItem('admin_pending_requests') || '[]');
        const index = requests.findIndex(r => r.id === id);

        if (index !== -1) {
            requests[index].status = newStatus;
            requests[index].processedDate = new Date().toISOString();
            
            localStorage.setItem('admin_pending_requests', JSON.stringify(requests));
            
            // ✅ إرسال إشعار للمستخدم
            localStorage.setItem('user_status_updated', Date.now().toString());
            
            alert(newStatus === 'accepted' ? '✅ تم القبول! سيتم تحويل المستخدم للمنصة الآن.' : '❌ تم رفض الطلب.');
            loadData();
        }
    }

    function renderIDs(acceptedUsers) {
        const container = document.getElementById('idsContainer');
        if (acceptedUsers.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:50px; opacity:0.5">لا توجد هويات مفعّلة حالياً</div>';
            return;
        }
        
        container.innerHTML = acceptedUsers.map(user => `
            <div class="request-card" style="border-right: 5px solid #00c853;">
                <div style="display:flex; gap:20px; align-items:center">
                    <img src="${user.characterImage?.data}" style="width:60px; height:60px; border-radius:50%; border:2px solid #ff9800">
                    <div>
                        <h3 style="color:#ff9800">${user.fullName}</h3>
                        <p style="font-size:12px; opacity:0.7">ID: ${user.gameId} | ${user.rank}</p>
                    </div>
                    <div style="margin-right:auto">
                        <span style="background:#00c853; padding:5px 10px; border-radius:20px; font-size:12px">نشط ✓</span>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function showPage(pageName) {
        document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
        document.getElementById(pageName + 'Page').style.display = 'block';
        document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    function openImg(src) {
        document.getElementById('fullImage').src = src;
        document.getElementById('imageModal').classList.add('active');
    }

    // 🔔 إشعار بصري
    function showNewRequestNotification() {
        const popup = document.getElementById('notificationPopup');
        popup.classList.add('show');
        setTimeout(() => {
            popup.classList.remove('show');
        }, 3000);
    }

    // 🔊 إشعار صوتي

        const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuByPDdlkMLD1ms6+ukVhEIR6Ho8sFuIwUrhcny3JdFDBBaqOrsp1YSCke15vO8bh8FKXfH8+CaRgwPV6vo7aNYEwlIr+fxwG0eByt7yPDjnEcLDlOp5O6lWRMISrXm8bxtIAUpd8Xw4JtHDA5WrOfuo1kUCUm15vK9bh8FJXXE8N+cSAwNVKzm7qNaFQpIr+bxwG4fBSh1xPDem0gMDlOq5e6kWhUKSa7m8b9uHwYndcXv35tJDA5SrOXuo1oVCkmv5vHAbSAGKHXE8N6bSAwPUqzl7qNaFwpKr+bxwG0fByd0xe/fm0kMDlKs5e6jWhYKSa/m8cBtIAUodMXv3ptKDA5SrOXvo1sWCkqv5vHAbSAFKHPF8N+bSQwOUazl76RbFQpKsOXxv20gBShzxfDfm0oMDlGs5e+kWhYKSbDl8cBtHwYocsTw35tKDA9RrOXvpFsWCkmv5vHAbR8GJHLE8OCbSgwPUazl76RbFQpKr+bxwG0gBSZyxPDgm0oMEFGr5e+kWhUKSq/m8cBtIAUpcsTv4JtKDBBSq+TvpFsVCkqv5/G/bR8FKXLE7+CbSgwQUqvk76RbFgpKsObxv20fBihyxO/gm0oMEFCr5O+kWxUKSrDm8b9tHwYocsTv4JtKDQ9Qq+TvpFsWCkuw5vG+bR8GKHLE7+CbSg0PUKzk76RbFgpLsOXxvm0gBShyw+/hm0oND1Cs5O+jWxYKSrDm8b5tHwUncsPv4JxKDRBQrOTvo1sXCkqw5vG+bSAGJ3LD8OCbSg0PUKzl7qNbFgpLr+bxvm0gBidyw+/gm0oND1Cs5e+jXBYLS7Dm8L5tIQYncsTv4JtKDRBPq+TvpFsWC0qw5vC+bSEGKHHE7+CcSgwRUKvk76NbFgpLsObwvm0hBihxxPDgnEoMEVCq5O+jWxYKSrHm8L5tIQYocsTw4JxKDBFQquPvo1sWCkux5vC+bSEGKHLE7+CcSg0RUKrj76RbFwpLsebwvm0hBihyxPDgnEoMEk+q4++kWxYKS7Hm8L5tIgYpcsTw4JtKDBJPquPvpFsWCkux5vC+bSIGKHLE8OCbSg0ST6rj76RbFwpLsebwvm0iBihyxPDgm0oNEk+q4++kXBYKS7Hm8L5tIgYocsTw4JtKDBNPquTvpFsWCkux5vC+bSMGKXPD8OCcSgwSTqvk76RbFwpLsebwvm0jBilzw/Dgm0oME06r5O+kWxcKSrHl8L9tIwYqc8Pw4ZtKDBNOq+TvpFsXCkqx5vC+bSMHKnPD8OGbSgwTTqvj76VbFwtLsebwvm0jByp0w/DhnEoME06r5O+kXBcLS7Hm8b5tIwcrdMPw4ZxKDBROq+Tvplw');
        audio.play().catch(e => console.log('🔇 الصوت معطل'));
    }

    // ✅ التشغيل التلقائي
    window.onload = () => {
        loadData();
        lastRequestCount = JSON.parse(localStorage.getItem('admin_pending_requests') || '[]').filter(r => r.status === 'pending').length;
    };
    
    // ✅ تحديث تلقائي كل 2 ثانية
    setInterval(loadData, 2000);
</script>

</body>
</html>
