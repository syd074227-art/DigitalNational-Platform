    body {
        background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
        min-height: 100vh;
        color: #fff;
        padding: 20px;
    }
    
    .header {

        border-radius: 20px;

    .header h1 {
        font-size: 36px;

    }

    .stats-grid {

        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

        padding: 25px;

    .stat-card .icon {
        width: 60px;
        height: 60px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin-bottom: 15px;
    }
    
    .stat-card.pending .icon { background: linear-gradient(135deg, #FFD600 0%, #FFA000 100%); }
    .stat-card.accepted .icon { background: linear-gradient(135deg, #00C853 0%, #009624 100%); }
    .stat-card.rejected .icon { background: linear-gradient(135deg, #D50000 0%, #B71C1C 100%); }
    .stat-card.total .icon { background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%); }
    
    .stat-card .number {
        font-size: 42px;
        font-weight: 800;
        margin-bottom: 5px;
    }
    
    .stat-card .label {
        font-size: 14px;
        opacity: 0.7;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    
    .filters {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 20px;
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
    }

        padding: 12px 24px;

        background: rgba(255, 255, 255, 0.05);

        transition: all 0.3s;

    .filter-btn:hover {
        background: rgba(255, 111, 0, 0.2);
        border-color: #ff6f00;
    }
    
    .filter-btn.active {
        background: linear-gradient(135deg, #ff6f00 0%, #ff9800 100%);

            grid-template-columns: 1fr;

        .request-info {

        }
        
        .request-actions {

        }

            flex: 1;

<div class="stats-grid">
    <div class="stat-card pending">
        <div class="icon"><i class="fas fa-clock"></i></div>
        <div class="number" id="pendingCount">0</div>
        <div class="label">قيد المراجعة</div>
    </div>
    
    <div class="stat-card accepted">
        <div class="icon"><i class="fas fa-check-circle"></i></div>
        <div class="number" id="acceptedCount">0</div>
        <div class="label">مقبول</div>
    </div>
    
    <div class="stat-card rejected">
        <div class="icon"><i class="fas fa-times-circle"></i></div>
        <div class="number" id="rejectedCount">0</div>
        <div class="label">مرفوض</div>
    </div>
    
    <div class="stat-card total">
        <div class="icon"><i class="fas fa-database"></i></div>
        <div class="number" id="totalCount">0</div>
        <div class="label">إجمالي الطلبات</div>
    </div>
</div>

<div class="filters">
    <button class="filter-btn active" onclick="filterRequests('all')">الكل</button>
    <button class="filter-btn" onclick="filterRequests('pending')">قيد المراجعة</button>
    <button class="filter-btn" onclick="filterRequests('accepted')">مقبول</button>
    <button class="filter-btn" onclick="filterRequests('rejected')">مرفوض</button>
</div>

<div class="requests-container" id="requestsContainer">
    <div class="loading"><i class="fas fa-spinner fa-spin"></i> جاري تحميل الطلبات...</div>
</div>

<div class="modal" id="imageModal">
    <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    <img id="modalImage" src="" alt="صورة">
</div>

<script type="module">
    // Firebase Configuration
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, getDocs, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY_HERE",
        authDomain: "your-project.firebaseapp.com",
        projectId: "your-project-id",
        storageBucket: "your-project.appspot.com",
        messagingSenderId: "123456789",
        appId: "your-app-id"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let allRequests = [];
    let currentFilter = 'all';
    
    // الاستماع للتحديثات الفورية
    const q = query(collection(db, "requests"), orderBy("createdAt", "desc"));
    
    onSnapshot(q, (querySnapshot) => {
        allRequests = [];
        querySnapshot.forEach((doc) => {
            allRequests.push({ firestoreId: doc.id, ...doc.data() });
        });
        
        updateStats();
        displayRequests();
    });
    
    function updateStats() {
        const pending = allRequests.filter(r => r.status === 'pending').length;
        const accepted = allRequests.filter(r => r.status === 'accepted').length;
        const rejected = allRequests.filter(r => r.status === 'rejected').length;
        
        document.getElementById('pendingCount').textContent = pending;
        document.getElementById('acceptedCount').textContent = accepted;
        document.getElementById('rejectedCount').textContent = rejected;
        document.getElementById('totalCount').textContent = allRequests.length;
    }
    
    window.filterRequests = function(filter) {
        currentFilter = filter;
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        event.target.classList.add('active');
        
        displayRequests();
    };
    
    function displayRequests() {
        const container = document.getElementById('requestsContainer');
        
        let filtered = allRequests;
        if (currentFilter !== 'all') {
            filtered = allRequests.filter(r => r.status === currentFilter);
        }
        
        if (filtered.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><h3>لا توجد طلبات</h3></div>';
            return;
        }
        
        container.innerHTML = filtered.map(req => `
            <div class="request-card ${req.status}">
                <div class="request-header">
                    <div class="request-id">#${req.id}</div>
                    <span class="request-status ${req.status}">${getStatusText(req.status)}</span>
                </div>
                
                <div class="request-info">
                    <div class="info-item">
                        <div class="info-label">الاسم</div>
                        <div class="info-value">${req.fullName}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">العمر</div>
                        <div class="info-value">${req.age} سنة</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">اسم المستخدم</div>
                        <div class="info-value">${req.gameUsername}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">الديسكورد</div>
                        <div class="info-value">${req.discordUsername}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">رقم الهوية</div>
                        <div class="info-value">${req.gameId}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">الوزارة</div>
                        <div class="info-value">${req.departmentName}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">الرتبة</div>
                        <div class="info-value">${req.rank}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">التاريخ</div>
                        <div class="info-value">${req.date}</div>
                    </div>
                </div>
                
                ${req.additionals && req.additionals.length > 0 ? `
                <div class="info-item" style="margin-bottom: 20px;">
                    <div class="info-label">المناصب الإدارية</div>
                    <div class="info-value">${req.additionals.join(' • ')}</div>
                </div>
                ` : ''}
                
                <div class="request-images">
                    <div class="image-box">
                        <div class="image-label">الهوية الوطنية</div>
                        <img src="${req.nationalIdImageURL}" alt="الهوية" onclick="showImage('${req.nationalIdImageURL}')">
                    </div>
                    <div class="image-box">
                        <div class="image-label">صورة الشخصية</div>
                        <img src="${req.characterImageURL}" alt="الشخصية" onclick="showImage('${req.characterImageURL}')">
                    </div>
                </div>
                
                ${req.adminNotes ? `
                <div class="info-item" style="margin-bottom: 15px;">
                    <div class="info-label">ملاحظات الإدارة</div>
                    <div class="info-value">${req.adminNotes}</div>
                </div>
                ` : ''}
                
                ${req.status === 'pending' ? `
                <textarea class="notes-input" id="notes-${req.firestoreId}" placeholder="ملاحظات الإدارة (اختياري)..."></textarea>
                
                <div class="request-actions">
                    <button class="action-btn accept" onclick="handleAction('${req.firestoreId}', 'accepted')">
                        <i class="fas fa-check"></i> قبول الطلب
                    </button>
                    <button class="action-btn reject" onclick="handleAction('${req.firestoreId}', 'rejected')">
                        <i class="fas fa-times"></i> رفض الطلب
                    </button>
                    <button class="action-btn delete" onclick="deleteRequest('${req.firestoreId}')">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
                ` : `
                <div class="request-actions">
                    <button class="action-btn delete" onclick="deleteRequest('${req.firestoreId}')" style="flex: 1;">
                        <i class="fas fa-trash"></i> حذف الطلب
                    </button>
                </div>
                `}
            </div>
        `).join('');
    }
    
    function getStatusText(status) {
        if (status === 'pending') return 'قيد المراجعة';
        if (status === 'accepted') return 'مقبول';
        if (status === 'rejected') return 'مرفوض';
        return status;
    }
    
    window.handleAction = async function(firestoreId, newStatus) {
        const notes = document.getElementById(`notes-${firestoreId}`).value.trim();
        
        try {
            const requestRef = doc(db, "requests", firestoreId);
            await updateDoc(requestRef, {
                status: newStatus,
                adminNotes: notes,
                updatedAt: new Date().toISOString(),
                reviewedAt: new Date().toISOString()
            });
            
            alert(`✅ تم ${newStatus === 'accepted' ? 'قبول' : 'رفض'} الطلب بنجاح!`);
        } catch (error) {
            console.error('خطأ:', error);
            alert('❌ حدث خطأ: ' + error.message);
        }
    };
    
    window.deleteRequest = async function(firestoreId) {
        if (!confirm('هل أنت متأكد من حذف هذا الطلب؟')) return;
        
        try {
            await deleteDoc(doc(db, "requests", firestoreId));
            alert('✅ تم حذف الطلب بنجاح!');
        } catch (error) {
            console.error('خطأ:', error);
            alert('❌ حدث خطأ: ' + error.message);
        }
    };
    
    window.showImage = function(url) {
        document.getElementById('modalImage').src = url;
        document.getElementById('imageModal').classList.add('show');
    };
    
    window.closeModal = function() {
        document.getElementById('imageModal').classList.remove('show');
    };
</script>
