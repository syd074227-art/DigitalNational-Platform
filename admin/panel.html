<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم KR - الإدارة العليا</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #1a237e;
            --accent: #ff6f00;
            --dark: #0d1117;
            --light: #ffffff;
            --success: #00c853;
            --danger: #d50000;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d1117; color: white; padding: 20px; }
        
        .dashboard-container { max-width: 1200px; margin: auto; }
        .header { background: linear-gradient(135deg, #1a237e 0%, #3f51b5 100%); padding: 30px; border-radius: 15px; margin-bottom: 30px; border-bottom: 4px solid var(--accent); display: flex; justify-content: space-between; align-items: center; }
        
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .stat-card i { font-size: 24px; color: var(--accent); margin-bottom: 10px; }
        .stat-card h3 { font-size: 28px; }

        .table-container { background: rgba(255,255,255,0.03); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: rgba(255,255,255,0.05); padding: 15px; text-align: right; color: var(--accent); border-bottom: 2px solid rgba(255,255,255,0.1); }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        
        .badge { padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .badge-dept { background: var(--primary); color: white; }
        .badge-rank { background: #333; color: var(--accent); border: 1px solid var(--accent); }
        
        .btn-delete { background: var(--danger); color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn-delete:hover { background: #b71c1c; transform: scale(1.1); }
        
        .empty-msg { padding: 40px; text-align: center; color: #888; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <div>
                <h1>لوحة تحكم الطلبات - KR</h1>
                <p>إدارة طلبات تفعيل الهوية الرقمية</p>
            </div>
            <i class="fas fa-user-shield fa-3x" style="color: rgba(255,255,255,0.2);"></i>
        </div>

        <div class="stats">
            <div class="stat-card">
                <i class="fas fa-file-alt"></i>
                <p>إجمالي الطلبات</p>
                <h3 id="totalRequests">0</h3>
            </div>
            <div class="stat-card">
                <i class="fas fa-clock"></i>
                <p>آخر تحديث</p>
                <h3 id="lastUpdate" style="font-size: 16px;">--:--</h3>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>التاريخ</th>
                        <th>الاسم الكامل</th>
                        <th>اسم المستخدم</th>
                        <th>رقم الهوية</th>
                        <th>الوزارة/الجهة</th>
                        <th>الرتبة</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    </tbody>
            </table>
            <div id="emptyMessage" class="empty-msg">جاري تحميل الطلبات من السيرفر...</div>
        </div>
    </div>

<script>
    // --- نفس إعدادات Firebase الموجودة في apply.html ---
    const firebaseConfig = {
        databaseURL: "https://myproject-7439e-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // مرجع الطلبات
    const ordersRef = database.ref('orders');

    // جلب البيانات وعرضها فوراً عند أي تغيير
    ordersRef.on('value', (snapshot) => {
        const data = snapshot.val();
        const tableBody = document.getElementById('adminTableBody');
        const emptyMessage = document.getElementById('emptyMessage');
        const totalRequests = document.getElementById('totalRequests');
        const lastUpdate = document.getElementById('lastUpdate');

        tableBody.innerHTML = ''; 
        
        if (data) {
            emptyMessage.style.display = 'none';
            let count = 0;
            
            // تحويل الكائن إلى مصفوفة لترتيبها (الأحدث أولاً)
            const keys = Object.keys(data).reverse();
            
            keys.forEach(id => {
                count++;
                const order = data[id];
                const row = `
                    <tr>
                        <td style="color: #888;">${order.time || 'غير محدد'}</td>
                        <td style="font-weight: bold;">${order.name}</td>
                        <td dir="ltr">${order.gameUser}</td>
                        <td style="color: var(--success); font-family: monospace; font-size: 16px;">${order.idInGame}</td>
                        <td><span class="badge badge-dept">${translateDept(order.dept)}</span></td>
                        <td><span class="badge badge-rank">${order.rank}</span></td>
                        <td>
                            <button class="btn-delete" onclick="deleteOrder('${id}')">
                                <i class="fas fa-trash"></i> حذف
                            </button>
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
            totalRequests.innerText = count;
            lastUpdate.innerText = new Date().toLocaleTimeString('ar-SA');
        } else {
            tableBody.innerHTML = '';
            emptyMessage.style.display = 'block';
            emptyMessage.innerText = 'لا توجد طلبات واردة حتى الآن.';
            totalRequests.innerText = '0';
        }
    });

    // دالة لحذف الطلب من قاعدة البيانات
    function deleteOrder(id) {
        if(confirm('هل أنت متأكد من حذف هذا الطلب نهائياً؟')) {
            database.ref('orders/' + id).remove()
                .then(() => alert('تم حذف الطلب بنجاح'))
                .catch(err => alert('خطأ في الحذف: ' + err.message));
        }
    }

    // دالة مساعدة لترجمة كود الوزارة لاسم مقروء
    function translateDept(dept) {
        const depts = {
            'health': 'وزارة الصحة',
            'interior': 'وزارة الداخلية',
            'justice': 'وزارة العدل',
            'citizen': 'مواطن'
        };
        return depts[dept] || dept;
    }
</script>
</body>
</html>
