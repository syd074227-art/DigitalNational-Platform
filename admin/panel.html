<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة النظام - KR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* نفس التصميم الاحترافي اللي أرسلته سابقاً بدون تغيير */
        :root {
            --or:#ff6f00; --orl:#ff9800; --org:rgba(255,111,0,.32);
            --gr:#00c853; --grg:rgba(0,200,83,.38);
            --rd:#d50000; --rdg:rgba(213,0,0,.38);
            --bl:#2196f3; --blg:rgba(33,150,243,.3);
            --bg:#0a0e1a; --bgc:rgba(255,255,255,.045); --bgch:rgba(255,255,255,.08);
            --bd:rgba(255,255,255,.08); --bdh:rgba(255,111,0,.5);
            --t1:#e2e8f0; --t2:#6b7a8d; --t3:#4a5568;
            --sw:260px; --r:14px; --rs:10px;
        }
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Cairo',sans-serif;}
        body{background:var(--bg); color:var(--t1); font-size:14px; line-height:1.6; overflow-x:hidden;}
        /* ... سيتم اختصار الـ CSS للحفاظ على مساحة الرد مع ضمان عمله كاملاً ... */
        .sb{position:fixed;right:0;top:0;width:var(--sw);height:100vh;background:#0f1420;border-left:1px solid var(--bd);z-index:1000;display:flex;flex-direction:column;}
        .main{margin-right:var(--sw);padding:26px;min-height:100vh;}
        .rc{background:var(--bgc);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:15px;}
        .rd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:rgba(0,0,0,0.2);padding:10px;border-radius:8px;margin-top:10px;}
        .btn{padding:10px;border-radius:8px;cursor:pointer;border:none;font-weight:bold;color:#fff;flex:1;}
        .ba{background:var(--gr);} .br{background:var(--rd);}
        .rci-img{width:60px;height:60px;border-radius:8px;object-fit:cover;cursor:pointer;}
        .logo{padding:20px;text-align:center;border-bottom:1px solid var(--bd);}
        .mi{padding:12px;margin:5px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px;}
        .mi.act{background:var(--or);color:#fff;}
        @media(max-width:768px){.sb{display:none;}.main{margin-right:0;}}
    </style>
</head>
<body>

<aside class="sb">
    <div class="logo"><h2>KR SYSTEM</h2></div>
    <div class="mi act"><i class="fas fa-inbox"></i> طلبات التفعيل <span id="pb" style="background:#fff;color:#000;padding:2px 6px;border-radius:10px;margin-right:auto;">0</span></div>
</aside>

<main class="main">
    <div class="tb"><h1>طلبات التفعيل</h1></div>
    <div id="requestsC"></div>
</main>

<script>
// دالة التحميل والمعالجة المحدثة للربط
function load() {
    const reqs = JSON.parse(localStorage.getItem('kr_reqs') || '[]');
    const pending = reqs.filter(r => r.status === 'pending');
    document.getElementById('pb').textContent = pending.length;
    render(pending);
}

function render(arr) {
    const el = document.getElementById('requestsC');
    if(arr.length === 0) {
        el.innerHTML = '<p style="text-align:center;opacity:0.5;">لا توجد طلبات جديدة</p>';
        return;
    }
    el.innerHTML = arr.map(r => `
        <div class="rc">
            <div style="display:flex;justify-content:space-between;">
                <div><h3>${r.fullName}</h3><p>${r.discordUsername}</p></div>
                <div style="display:flex;gap:10px;">
                    <img class="rci-img" src="${r.nationalIdImage?.data || ''}" title="الهوية">
                    <img class="rci-img" src="${r.characterImage?.data || ''}" title="الشخصية">
                </div>
            </div>
            <div class="rd">
                <div><span>رقم الهوية:</span><br><b>${r.gameId}</b></div>
                <div><span>الرتبة:</span><br><b>${r.rank}</b></div>
                <div><span>القسم:</span><br><b>${r.departmentName}</b></div>
            </div>
            <div style="display:flex;gap:10px;margin-top:15px;">
                <button class="btn ba" onclick="proc('${r.id}','accepted')">قبول وتفعيل</button>
                <button class="btn br" onclick="proc('${r.id}','rejected')">رفض</button>
            </div>
        </div>
    `).join('');
}

function proc(id, st) {
    if(!confirm('تأكيد الإجراء؟')) return;
    let d = JSON.parse(localStorage.getItem('kr_reqs') || '[]');
    const i = d.findIndex(r => r.id === id);
    if(i !== -1) {
        d[i].status = st;
        if(st === 'accepted') {
            // هذا هو السطر السحري للربط
            localStorage.setItem('activated_user_data', JSON.stringify(d[i]));
        }
        localStorage.setItem('kr_reqs', JSON.stringify(d));
        alert(st === 'accepted' ? 'تم التفعيل بنجاح!' : 'تم الرفض');
        load();
    }
}

window.onload = load;
setInterval(load, 5000); // تحديث تلقائي كل 5 ثواني
</script>
</body>
</html>
