<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اللوحة الإدارية - نظام إدارة طلبات التفعيل</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

</head>
<body>
    <!-- الهيدر -->
    <header class="admin-header">
        <div class="header-content">
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div class="logo-text">
                    <h1>اللوحة الإدارية</h1>
                    <p>نظام إدارة طلبات التفعيل</p>
                </div>
            </div>
            <div class="header-actions">
                <div class="notification-badge" id="notificationBadge" style="display: none;">
                    <i class="fas fa-bell"></i>
                    <span id="notificationCount">0</span>
                </div>
                <button class="btn" onclick="openSettings()">
                    <i class="fas fa-cog"></i>
                    <span>الإعدادات</span>
                </button>
            </div>
        </div>
    </header>

    <!-- باقي الشفرة HTML تبقى كما هي -->
    <!-- ... -->

    <script>
        // ====== تكوين Firebase ======
        const firebaseConfig = {
            apiKey: "AIzaSyC4N68B8RQmzS_h5d8Q6vM4l5oWv5mW8Hs",
            authDomain: "kr-system-5c846.firebaseapp.com",
            databaseURL: "https://kr-system-5c846-default-rtdb.firebaseio.com",
            projectId: "kr-system-5c846",
            storageBucket: "kr-system-5c846.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef1234567890"
        };

        // تهيئة Firebase
        let firebaseApp, database;

        try {
            firebaseApp = firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            console.log('✅ Firebase تم التهيئة بنجاح في لوحة التحكم');
        } catch (error) {
            console.error('❌ خطأ في تهيئة Firebase:', error);
            showAlert('حدث خطأ في الاتصال بقاعدة البيانات', 'danger');
        }

        // ====== النظام الأساسي ======
        let allRequests = [];
        let filteredRequests = [];
        let registeredAccounts = [];

        // ====== عند تحميل الصفحة ======
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 نظام الإدارة الفاخر - جاهز');
            
            if (database) {
                // تحميل البيانات من Firebase
                loadDataFromFirebase();
                
                // الاستماع للتحديثات في الوقت الحقيقي
                setupRealtimeListeners();
            } else {
                // إذا فشل Firebase، تحميل البيانات المحلية
                loadLocalData();
            }
            
            // إعداد البحث الذكي
            setupSmartSearch();
            
            // إعداد الأنيميشن
            setupAnimations();
        });

        // ====== تحميل البيانات من Firebase ======
        function loadDataFromFirebase() {
            console.log('📥 جاري تحميل البيانات من Firebase...');
            
            // تحميل الطلبات
            database.ref('requests').on('value', (snapshot) => {
                const requestsData = snapshot.val() || {};
                
                allRequests = Object.keys(requestsData).map(key => {
                    const request = requestsData[key];
                    return {
                        id: request.id || key,
                        firebaseId: key,
                        name: request.fullName || request.name || 'غير معروف',
                        gameId: request.gameId || request.idNumber || 'غير معروف',
                        department: request.department || request.jobType || 'citizen',
                        departmentName: request.departmentName || getDepartmentName(request.department) || 'مواطن',
                        rank: request.rank || 'غير محدد',
                        date: request.formattedDate || request.date || 'غير معروف',
                        status: request.status || 'pending',
                        age: request.age || 'غير معروف',
                        discord: request.discordUsername || 'غير معروف',
                        gameUsername: request.gameUsername || 'غير معروف',
                        additionals: request.additionals || [],
                        hasNationalIdImage: request.hasNationalIdImage || false,
                        hasCharacterImage: request.hasCharacterImage || false,
                        imageUrls: request.imageUrls || null,
                        reviewed: request.reviewed || false,
                        reviewNotes: request.reviewNotes || '',
                        reviewer: request.reviewer || '',
                        priority: request.priority || 'normal',
                        timestamp: request.timestamp || Date.now()
                    };
                });
                
                // ترتيب حسب التاريخ (الأحدث أولاً)
                allRequests.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                
                console.log(`✅ تم تحميل ${allRequests.length} طلب من Firebase`);
                renderRequestsTable(allRequests);
                loadRegisteredAccounts();
                updateStatistics();
                updateNotificationCount();
            });
            
            // تحميل الإحصائيات
            database.ref('statistics').on('value', (snapshot) => {
                const stats = snapshot.val();
                if (stats) {
                    document.getElementById('totalRequests').textContent = stats.total || 0;
                    document.getElementById('pendingRequests').textContent = stats.pending || 0;
                    document.getElementById('approvedRequests').textContent = stats.accepted || 0;
                    document.getElementById('rejectedRequests').textContent = stats.rejected || 0;
                }
            });
        }

        // ====== إعداد الاستماع في الوقت الحقيقي ======
        function setupRealtimeListeners() {
            // الاستماع للإشعارات الجديدة
            database.ref('admin_notifications').orderByChild('timestamp').limitToLast(10)
                .on('value', (snapshot) => {
                    const notifications = snapshot.val() || {};
                    const unreadCount = Object.values(notifications).filter(n => !n.read).length;
                    
                    updateNotificationBadge(unreadCount);
                });
            
            // الاستماع للطلبات الجديدة
            database.ref('requests').orderByChild('timestamp').limitToLast(1)
                .on('child_added', (snapshot) => {
                    const newRequest = snapshot.val();
                    console.log('🆕 طلب جديد:', newRequest.fullName);
                    
                    // عرض إشعار للطلب الجديد
                    showNewRequestNotification(newRequest);
                });
        }

        // ====== تحميل البيانات المحلية (نسخة احتياطية) ======
        function loadLocalData() {
            console.log('📥 جاري تحميل البيانات المحلية...');
            
            const sources = [
                'admin_panel_requests',
                'admin_requests',
                'admin_backup_requests',
                'pending_requests'
            ];
            
            allRequests = [];
            
            sources.forEach(source => {
                try {
                    const data = JSON.parse(localStorage.getItem(source) || '[]');
                    if (Array.isArray(data) && data.length > 0) {
                        allRequests = [...allRequests, ...data];
                    }
                } catch (error) {
                    console.log(`⚠️ خطأ في قراءة ${source}:`, error);
                }
            });
            
            if (allRequests.length === 0) {
                allRequests = getSampleData();
            }
            
            console.log(`✅ تم تحميل ${allRequests.length} طلب محلياً`);
            renderRequestsTable(allRequests);
            loadRegisteredAccounts();
            updateStatistics();
        }

        // ====== عرض إشعار للطلب الجديد ======
        function showNewRequestNotification(request) {
            const notificationSound = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3');
            notificationSound.play().catch(e => console.log('لا يمكن تشغيل الصوت'));
            
            // إنشاء إشعار على الشاشة
            const notification = document.createElement('div');
            notification.className = 'floating-notification';
            notification.innerHTML = `
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div style="background: var(--gradient-primary); width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-user-plus" style="color: white; font-size: 22px;"></i>
                    </div>
                    <div>
                        <strong style="color: white; font-size: 16px;">طلب تفعيل جديد</strong>
                        <p style="color: rgba(255,255,255,0.8); margin: 5px 0 0 0; font-size: 14px;">
                            ${request.fullName} - ${request.departmentName}
                        </p>
                    </div>
                </div>
                <button onclick="this.parentElement.remove()" style="background: none; border: none; color: white; font-size: 20px; cursor: pointer;">
                    <i class="fas fa-times"></i>
                </button>
            `;
            
            notification.style.cssText = `
                position: fixed;
                top: 100px;
                left: 30px;
                background: rgba(30, 58, 138, 0.95);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 15px;
                padding: 20px;
                z-index: 9999;
                animation: slideInLeft 0.5s ease;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 20px;
                min-width: 350px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            `;
            
            document.body.appendChild(notification);
            
            // إزالة الإشعار تلقائياً بعد 5 ثواني
            setTimeout(() => {
                if (notification.parentElement) {
                    notification.style.animation = 'slideOutLeft 0.5s ease';
                    setTimeout(() => notification.remove(), 500);
                }
            }, 5000);
        }

        // ====== تحديث شارة الإشعارات ======
        function updateNotificationBadge(count) {
            const badge = document.getElementById('notificationBadge');
            const countSpan = document.getElementById('notificationCount');
            
            if (count > 0) {
                badge.style.display = 'flex';
                countSpan.textContent = count;
                
                // تأثير النبض
                badge.style.animation = 'pulse 2s infinite';
            } else {
                badge.style.display = 'none';
            }
        }

        // ====== دوال إدارة الطلبات ======

        // قبول الطلب
        async function approveRequest(requestId) {
            const request = allRequests.find(r => r.id === requestId || r.firebaseId === requestId);
            if (!request) return;

            try {
                if (database && request.firebaseId) {
                    await database.ref(`requests/${request.firebaseId}`).update({
                        status: 'approved',
                        reviewed: true,
                        reviewer: 'المسؤول',
                        reviewDate: new Date().toISOString()
                    });
                    
                    // نقل الطلب إلى القائمة المقبولة
                    await database.ref(`approved_requests/${request.firebaseId}`).set(request);
                    
                    // حذف من الطلبات المعلقة
                    await database.ref(`admin_pending_requests/${request.firebaseId}`).remove();
                    
                    // تحديث الإحصائيات
                    await updateFirebaseStats();
                    
                    // إنشاء إشعار للمستخدم
                    await createUserNotification(request, 'approved');
                    
                    showAlert('✅ تم قبول الطلب بنجاح', 'success');
                } else {
                    // إذا لم يكن متصلاً بـ Firebase
                    request.status = 'approved';
                    request.reviewed = true;
                    request.reviewer = 'المسؤول';
                    request.reviewDate = new Date().toISOString();
                    
                    renderRequestsTable(allRequests);
                    updateStatistics();
                    showAlert('✅ تم قبول الطلب بنجاح (محلياً)', 'success');
                }
            } catch (error) {
                console.error('❌ خطأ في قبول الطلب:', error);
                showAlert('❌ حدث خطأ في قبول الطلب', 'danger');
            }
        }

        // رفض الطلب
        async function rejectRequest(requestId, reason = '') {
            const request = allRequests.find(r => r.id === requestId || r.firebaseId === requestId);
            if (!request) return;

            const rejectReason = reason || prompt('أدخل سبب الرفض:', 'لم يتم استيفاء الشروط المطلوبة');
            if (!rejectReason) return;

            try {
                if (database && request.firebaseId) {
                    await database.ref(`requests/${request.firebaseId}`).update({
                        status: 'rejected',
                        reviewed: true,
                        reviewer: 'المسؤول',
                        reviewNotes: rejectReason,
                        reviewDate: new Date().toISOString()
                    });
                    
                    // نقل الطلب إلى القائمة المرفوضة
                    await database.ref(`rejected_requests/${request.firebaseId}`).set({
                        ...request,
                        rejectReason: rejectReason
                    });
                    
                    // حذف من الطلبات المعلقة
                    await database.ref(`admin_pending_requests/${request.firebaseId}`).remove();
                    
                    // تحديث الإحصائيات
                    await updateFirebaseStats();
                    
                    // إنشاء إشعار للمستخدم
                    await createUserNotification(request, 'rejected', rejectReason);
                    
                    showAlert('✅ تم رفض الطلب بنجاح', 'success');
                } else {
                    // إذا لم يكن متصلاً بـ Firebase
                    request.status = 'rejected';
                    request.reviewed = true;
                    request.reviewer = 'المسؤول';
                    request.reviewNotes = rejectReason;
                    request.reviewDate = new Date().toISOString();
                    
                    renderRequestsTable(allRequests);
                    updateStatistics();
                    showAlert('✅ تم رفض الطلب بنجاح (محلياً)', 'success');
                }
            } catch (error) {
                console.error('❌ خطأ في رفض الطلب:', error);
                showAlert('❌ حدث خطأ في رفض الطلب', 'danger');
            }
        }

            document.body.appendChild(modal);
            
            // إضافة الأنماط للمودال
            const style = document.createElement('style');
            style.textContent = `

            document.head.appendChild(style);

        // ====== دوال مساعدة ======
        function getDepartmentName(department) {
            const departments = {
                'health': 'وزارة الصحة',
                'interior': 'وزارة الداخلية',
                'justice': 'وزارة العدل',
                'citizen': 'مواطن'
            };
            return departments[department] || department;
        }

        function getStatusText(status) {
            const statuses = {
                'pending': 'قيد المراجعة',
                'approved': 'مقبولة',
                'rejected': 'مرفوضة'
            };
            return statuses[status] || status;
        }

        async function updateFirebaseStats() {
            if (!database) return;

            try {
                const stats = {
                    total: allRequests.length,
                    pending: allRequests.filter(r => r.status === 'pending').length,
                    approved: allRequests.filter(r => r.status === 'approved').length,
                    rejected: allRequests.filter(r => r.status === 'rejected').length,
                    lastUpdate: new Date().toISOString()
                };

                await database.ref('statistics').set(stats);
            } catch (error) {
                console.error('❌ خطأ في تحديث الإحصائيات:', error);
            }
        }

        async function createUserNotification(request, type, reason = '') {
            if (!database) return;

            try {
                const notification = {
                    id: 'user_notif_' + Date.now(),
                    type: type,
                    title: type === 'approved' ? '✅ تم قبول طلبك' : '❌ تم رفض طلبك',
                    message: type === 'approved' 
                        ? `مبروك! تم قبول طلب تفعيل هويتك في ${request.departmentName}`
                        : `نعتذر، تم رفض طلبك. السبب: ${reason}`,
                    requestId: request.id,
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    read: false
                };

                await database.ref(`user_notifications/${request.deviceId}`).push(notification);
            } catch (error) {
                console.error('❌ خطأ في إنشاء إشعار للمستخدم:', error);
            }
        }
