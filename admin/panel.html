<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة نظام الهيئة الرقمية KR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #1a237e;
            --accent: #ff6f00;
            --success: #00c853;
            --danger: #d50000;
            --warning: #ffd600;
            --dark-card: rgba(13, 17, 23, 0.95);
            --border: rgba(255, 255, 255, 0.1);
            --gradient-dark: linear-gradient(135deg, #0d1117 0%, #1a237e 50%, #0d1117 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Cairo', sans-serif; }
        body { background: var(--gradient-dark); color: white; min-height: 100vh; padding: 20px; }

        .admin-header {
            max-width: 1300px; margin: 0 auto 30px;
            background: var(--dark-card); padding: 30px; border-radius: 24px;
            border: 1px solid var(--border); border-bottom: 4px solid var(--accent);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;
        }

        .search-section { display: flex; gap: 10px; flex-grow: 1; max-width: 700px; }
        .search-input {
            flex-grow: 1; padding: 12px 20px; border-radius: 12px;
            border: 1px solid var(--border); background: rgba(0,0,0,0.3);
            color: white; outline: none; transition: 0.3s;
        }
        .search-input:focus { border-color: var(--accent); }

        .orders-grid { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 25px; }

        .order-card {
            background: var(--dark-card); border-radius: 24px; border: 1px solid var(--border);
            overflow: hidden; animation: slideUp 0.5s ease; position: relative;
        }

        .card-header {
            background: rgba(255,255,255,0.05); padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .card-body { padding: 25px; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }

        /* تفاصيل البيانات */
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .data-item { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .data-item label { display: block; color: var(--accent); font-size: 12px; font-weight: bold; margin-bottom: 5px; }
        .data-item span { font-size: 15px; word-break: break-all; }

        /* مراجعة الصور */
        .photos-review { display: flex; flex-direction: column; gap: 15px; }
        .photo-box { border: 2px solid var(--border); border-radius: 15px; overflow: hidden; position: relative; }
        .photo-box img { width: 100%; height: 160px; object-fit: cover; cursor: pointer; transition: 0.3s; }
        .photo-box img:hover { transform: scale(1.05); }
        .photo-tag { position: absolute; bottom: 0; background: rgba(0,0,0,0.8); width: 100%; text-align: center; padding: 5px; font-size: 11px; color: var(--accent-light); }

        /* أزرار التحكم الثلاثية */
        .card-actions {
            padding: 20px; background: rgba(0,0,0,0.2);
            display: grid; grid-template-columns: 1.5fr 1.5fr 1.5fr 0.5fr; gap: 12px;
        }

        .btn { 
            padding: 14px; border-radius: 12px; border: none; cursor: pointer; 
            font-weight: 800; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px;
        }
        .btn-extend { background: var(--warning); color: #000; }
        .btn-accept { background: var(--success); color: #fff; }
        .btn-reject { background: var(--danger); color: #fff; }
        .btn-delete { background: #333; color: #fff; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        .status-badge { padding: 4px 12px; border-radius: 50px; font-size: 12px; font-weight: bold; }
        .status-pending { background: #555; }
        .status-extended { background: var(--warning); color: #000; }
        .status-accepted { background: var(--success); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 850px) { .card-body { grid-template-columns: 1fr; } .card-actions { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="admin-header">
        <div>
            <h1><i class="fas fa-id-card-alt"></i> إدارة النظام الهيئة الرقميه KR</h1>
            <p style="color: var(--accent-light);">نظام التدقيق والمراجعة الشاملة للمتقدمين</p>
        </div>
        <div class="search-section">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث بالاسم، الآيدي، اليوزر..." onkeyup="filterOrders()">
            <select id="filterDept" class="search-input" style="max-width: 160px;" onchange="filterOrders()">
                <option value="">كل القطاعات</option>
                <option value="وزارة الصحة">وزارة الصحة</option>
                <option value="وزارة الداخلية">وزارة الداخلية</option>
                <option value="وزارة العدل">وزارة العدل</option>
                <option value="مواطن">مواطن</option>
            </select>
        </div>
    </div>

    <div id="ordersList" class="orders-grid">
        </div>

<script>
    // --- إعدادات Firebase ---
    const firebaseConfig = { databaseURL: "https://myproject-7439e-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // جلب البيانات لحظياً
    db.ref('orders').on('value', (snapshot) => {
        const data = snapshot.val();
        renderDashboard(data);
    });

    function renderDashboard(data) {
        const container = document.getElementById('ordersList');
        container.innerHTML = '';
        if (!data) { container.innerHTML = '<div style="text-align:center; padding:100px; opacity:0.5;">لا توجد طلبات معلقة</div>'; return; }

        Object.keys(data).reverse().forEach(key => {
            const order = data[key];
            const sClass = order.status === 'accepted' ? 'status-accepted' : (order.status === 'extended' ? 'status-extended' : 'status-pending');
            const sText = order.status === 'accepted' ? 'مقبول' : (order.status === 'extended' ? 'تم التمديد' : 'قيد المراجعة');

            const card = `
                <div class="order-card" data-info="${order.fullName} ${order.gameId} ${order.gameUsername} ${order.departmentName}">
                    <div class="card-header">
                        <span>معرف الطلب: <b style="color:var(--accent)">${order.id}</b></span>
                        <span class="status-badge ${sClass}">${sText}</span>
                    </div>

                    <div class="card-body">
                        <div class="info-grid">
                            <div class="data-item"><label>الاسم الثلاثي</label><span>${order.fullName}</span></div>
                            <div class="data-item"><label>العمر</label><span>${order.age} سنة</span></div>
                            <div class="data-item"><label>يوزر اللعبة</label><span>${order.gameUsername}</span></div>
                            <div class="data-item"><label>يوزر الديسكورد</label><span>${order.discordUsername}</span></div>
                            <div class="data-item"><label>الآيدي (ID)</label><span>${order.gameId}</span></div>
                            <div class="data-item"><label>القطاع المستهدف</label><span>${order.departmentName}</span></div>
                            <div class="data-item" style="grid-column: 1 / -1;">
                                <label>الرتب والمناصب (إن وجد)</label>
                                <span>${order.additionals ? order.additionals.join(' • ') : 'لا يوجد رتب إضافية'}</span>
                            </div>
                        </div>

                        <div class="photos-review">
                            <div class="photo-box">
                                <img src="${order.nationalIdImage}" onclick="window.open(this.src)">
                                <div class="photo-tag">بطاقة الهوية</div>
                            </div>
                            <div class="photo-box">
                                <img src="${order.characterImage}" onclick="window.open(this.src)">
                                <div class="photo-tag">صورة الشخصية</div>
                            </div>
                        </div>
                    </div>

                    <div class="card-actions">
                        <button class="btn btn-extend" onclick="setAction('${key}', 'extended')">
                            <i class="fas fa-clock"></i> تمديد المراجعة
                        </button>
                        <button class="btn btn-accept" onclick="setAction('${key}', 'accepted')">
                            <i class="fas fa-check-circle"></i> قبول الطلب
                        </button>
                        <button class="btn btn-reject" onclick="setAction('${key}', 'rejected')">
                            <i class="fas fa-times-circle"></i> رفض الطلب
                        </button>
                        <button class="btn btn-delete" onclick="deleteEntry('${key}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
            container.innerHTML += card;
        });
    }

    // تنفيذ الإجراءات
    function setAction(key, status) {
        let msg = status === 'accepted' ? 'هل أنت متأكد من قبول هذا الشخص في النظام؟' : 
                  status === 'extended' ? 'سيتم إشعار الشخص بتمديد مهلة التدقيق، استمرار؟' : 
                  'سيتم رفض الشخص وإعادته لصفحة التقديم، هل أنت متأكد؟';

        if(confirm(msg)) {
            db.ref('orders/' + key).update({ status: status })
            .then(() => {
                if(status === 'rejected') alert('تم رفض الطلب بنجاح');
            });
        }
    }

    function deleteEntry(key) {
        if(confirm('سيتم حذف السجل نهائياً، موافق؟')) db.ref('orders/' + key).remove();
    }

    // البحث المتقدم
    function filterOrders() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const dept = document.getElementById('filterDept').value;
        const cards = document.querySelectorAll('.order-card');

        cards.forEach(card => {
            const text = card.getAttribute('data-info').toLowerCase();
            const matchSearch = text.includes(term);
            const matchDept = dept === "" || text.includes(dept.toLowerCase());
            card.style.display = (matchSearch && matchDept) ? "block" : "none";
        });
    }
</script>
</body>
</html>
