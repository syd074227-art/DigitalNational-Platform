<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم التفعيل</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <h2>طلبات تفعيل الهوية</h2>
    <div id="requestsContainer"></div>

    <script>
      // 🟢 Firebase config
      const firebaseConfig = {
        apiKey: "AIzaSyCuP4NMBR-hDYZjI88hrnP-maWRs9wDK_I",
        authDomain: "myproject-7439e.firebaseapp.com",
        projectId: "myproject-7439e",
        storageBucket: "myproject-7439e.appspot.com",
        messagingSenderId: "469567490419",
        appId: "1:469567490419:web:ce6453c7f74d1863c61d06"
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      const requestsContainer = document.getElementById("requestsContainer");

      // 🟢 تحميل الطلبات pending
      async function loadRequests() {
        const snapshot = await db.collection("activation_requests")
                                 .where("status", "==", "pending")
                                 .orderBy("createdAt", "desc")
                                 .get();

        requestsContainer.innerHTML = "";

        if (snapshot.empty) {
          requestsContainer.innerHTML = "<p>لا توجد طلبات حالياً.</p>";
          return;
        }

        snapshot.forEach(doc => {
          const data = doc.data();
          const div = document.createElement("div");
          div.style.border = "1px solid #ccc";
          div.style.padding = "15px";
          div.style.margin = "10px 0";
          div.innerHTML = `
            <p><strong>الاسم:</strong> ${data.fullName}</p>
            <p><strong>رقم الهوية/اللعبة:</strong> ${data.gameId}</p>
            <p><img src="${data.identityImage}" width="150"></p>
            <button onclick="activateUser('${doc.id}', '${data.fullName}', '${data.gameId}', '${data.identityImage}')">تفعيل</button>
          `;
          requestsContainer.appendChild(div);
        });
      }

      // 🟢 تفعيل المستخدم
      async function activateUser(docId, fullName, gameId, identityImage) {
        try {
          // تحديث حالة الطلب
          await db.collection("activation_requests").doc(docId).update({
            status: "active"
          });

          // حفظ بيانات مفعلة لتخزينها في LocalStorage عند دخول المستخدم
          await db.collection("activated_users").doc(gameId).set({
            fullName: fullName,
            gameId: gameId,
            characterImage: { data: identityImage },
            activatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          alert("تم تفعيل الطلب ✅");
          loadRequests(); // إعادة تحميل الطلبات
        } catch (err) {
          alert("حدث خطأ: " + err.message);
        }
      }

      loadRequests();
    </script>
</body>
</html>
