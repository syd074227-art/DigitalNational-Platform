<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة المتطورة - KR System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        /* CSS الكود السابق نفسه */
    </style>
</head>
<body>

<script>
// ✅ تكوين Firebase - نفس التكوين
const firebaseConfig = {
    databaseURL: "https://kr-system-5c846-default-rtdb.firebaseio.com/"
};

// ✅ تهيئة Firebase
let database;
try {
    const app = firebase.initializeApp(firebaseConfig);
    database = firebase.database();
    console.log('✅ Firebase Admin جاهز للعمل');
} catch (error) {
    console.log('⚠️ Firebase غير مهيئ:', error);
    database = null;
}

let firebaseRequestsListener = null;

// ✅ تحميل البيانات من Firebase
function loadData() {
    if (database) {
        loadFromFirebase();
    } else {
        loadFromLocalStorage();
    }
}

// ✅ تحميل من Firebase
function loadFromFirebase() {
    if (!database) return;
    
    const requestsRef = database.ref('requests');
    
    // إزالة المستمع السابق إذا كان موجوداً
    if (firebaseRequestsListener) {
        requestsRef.off('value', firebaseRequestsListener);
    }
    
    // الاستماع للتحديثات الفورية
    firebaseRequestsListener = requestsRef.on('value', (snapshot) => {
        const requests = [];
        if (snapshot.exists()) {
            snapshot.forEach(childSnapshot => {
                const request = childSnapshot.val();
                request.firebaseKey = childSnapshot.key; // حفظ المفتاح
                requests.push(request);
            });
        }
        
        // فرز الطلبات حسب التاريخ
        requests.sort((a, b) => new Date(b.submissionDate) - new Date(a.submissionDate));
        
        updateStats(requests);
        renderRequests(requests);
        renderIDs(requests.filter(r => r.status === 'accepted'));
    });
}

// ✅ تحميل من localStorage
function loadFromLocalStorage() {
    const requests = JSON.parse(localStorage.getItem('admin_pending_requests') || '[]');
    updateStats(requests);
    renderRequests(requests);
    renderIDs(requests.filter(r => r.status === 'accepted'));
}

// ✅ معالجة الطلب (قبول/رفض)
function processRequest(id, newStatus) {
    if(!confirm(`هل أنت متأكد من ${newStatus === 'accepted' ? 'قبول' : 'رفض'} الطلب؟`)) return;

    if (database) {
        // ✅ تحديث في Firebase
        updateFirebaseRequest(id, newStatus)
            .then(() => {
                alert(newStatus === 'accepted' 
                    ? '✅ تم قبول الطلب! سيتم تحويل المستخدم للبوابة الآن.' 
                    : '❌ تم رفض الطلب.');
                loadData();
            })
            .catch(error => {
                console.error('❌ خطأ في تحديث Firebase:', error);
                alert('⚠️ خطأ في تحديث قاعدة البيانات، جاري المحاولة مع النسخة المحلية...');
                updateLocalStorageRequest(id, newStatus);
            });
    } else {
        // ✅ تحديث في localStorage فقط
        updateLocalStorageRequest(id, newStatus);
        alert(newStatus === 'accepted' 
            ? '✅ تم قبول الطلب! (نسخة محلية)' 
            : '❌ تم رفض الطلب. (نسخة محلية)');
        loadData();
    }
}

// ✅ تحديث الطلب في Firebase
function updateFirebaseRequest(requestId, newStatus) {
    return new Promise((resolve, reject) => {
        const requestsRef = database.ref('requests');
        
        // البحث عن الطلب بالمفتاح
        requestsRef.orderByChild('id').equalTo(requestId).once('value')
            .then(snapshot => {
                if (snapshot.exists()) {
                    let firebaseKey = null;
                    snapshot.forEach(childSnapshot => {
                        firebaseKey = childSnapshot.key;
                    });
                    
                    if (firebaseKey) {
                        const updates = {
                            status: newStatus,
                            processedDate: new Date().toISOString(),
                            processedBy: 'admin'
                        };
                        
                        database.ref(`requests/${firebaseKey}`).update(updates)
                            .then(() => {
                                // ✅ أيضًا تحديث localStorage
                                updateLocalStorageRequest(requestId, newStatus);
                                resolve();
                            })
                            .catch(error => reject(error));
                    } else {
                        reject('❌ لم يتم العثور على المفتاح');
                    }
                } else {
                    reject('❌ لم يتم العثور على الطلب في Firebase');
                }
            })
            .catch(error => reject(error));
    });
}

// ✅ تحديث الطلب في localStorage
function updateLocalStorageRequest(requestId, newStatus) {
    let requests = JSON.parse(localStorage.getItem('admin_pending_requests') || '[]');
    const index = requests.findIndex(r => r.id === requestId);
    
    if (index !== -1) {
        requests[index].status = newStatus;
        requests[index].processedDate = new Date().toISOString();
        requests[index].processedBy = 'admin';
        
        localStorage.setItem('admin_pending_requests', JSON.stringify(requests));
    }
}

// ✅ باقي الدوال (updateStats, renderRequests, renderIDs) تظل كما هي
// مع تعديل بسيط لاستخدام البيانات من Firebase

function renderRequests(data) {
    const container = document.getElementById('requestsContainer');
    const pending = data.filter(r => r.status === 'pending');
    
    if(pending.length === 0) {
        container.innerHTML = `
            <div style="text-align:center; padding:50px; opacity:0.5">
                <i class="fas fa-inbox" style="font-size:60px; margin-bottom:20px; display:block;"></i>
                لا توجد طلبات جديدة حالياً
                ${database ? '<div style="margin-top:20px; color:#4CAF50;"><i class="fas fa-database"></i> متصل بقاعدة البيانات السحابية</div>' : ''}
            </div>`;
        return;
    }

    container.innerHTML = pending.map((req, index) => `
        <div class="request-card ${index === 0 ? 'new-request' : ''}">
            ${index === 0 ? '<div class="new-badge"><i class="fas fa-star"></i> جديد</div>' : ''}
            ${req.firebaseKey ? '<div class="new-badge" style="background:#4CAF50; left:auto; right:-10px;"><i class="fas fa-cloud"></i> سحابي</div>' : ''}
            
            <div class="card-header">
                <div class="user-meta">
                    <h2>${req.fullName}</h2>
                    <p><i class="fab fa-discord"></i> ${req.discordUsername}</p>
                </div>
                <div class="image-preview-group">
                    <div class="thumb-img" onclick="alert('الصورة محفوظة في قاعدة البيانات')">
                        <i class="fas fa-id-card" style="font-size: 30px; color: #ff9800;"></i>
                    </div>
                    <div class="thumb-img" onclick="alert('صورة الشخصية محفوظة في قاعدة البيانات')">
                        <i class="fas fa-user" style="font-size: 30px; color: #2196f3;"></i>
                    </div>
                </div>
            </div>
            
            <div class="details-list">
                <div class="detail-item"><span>رقم الهوية</span><b>${req.gameId}</b></div>
                <div class="detail-item"><span>اسم اللعبة</span><b>${req.gameUsername}</b></div>
                <div class="detail-item"><span>العمر</span><b>${req.age} سنة</b></div>
                <div class="detail-item"><span>التصنيف</span><b>${req.departmentName}</b></div>
                <div class="detail-item"><span>الرتبة</span><b>${req.rank}</b></div>
                <div class="detail-item"><span>التاريخ</span><b>${req.date}</b></div>
            </div>
            
            <div class="actions">
                <button class="btn btn-accept" onclick="processRequest('${req.id}', 'accepted')">
                    <i class="fas fa-check"></i> قبول وتفعيل
                </button>
                <button class="btn btn-reject" onclick="processRequest('${req.id}', 'rejected')">
                    <i class="fas fa-times"></i> رفض الطلب
                </button>
            </div>
        </div>
    `).join('');
}

// ✅ عند تحميل الصفحة
window.onload = () => {
    loadData();
};

// ✅ عند إغلاق الصفحة
window.addEventListener('beforeunload', function() {
    if (firebaseRequestsListener && database) {
        const requestsRef = database.ref('requests');
        requestsRef.off('value', firebaseRequestsListener);
    }
});
</script>

</body>
</html>
