<script>
    // Firebase Configuration
    const firebaseConfig = {
        databaseURL: "https://kr-system-5c846-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let allApplications = [];
    let currentFilter = 'all';

    // Check authentication
    const adminUser = sessionStorage.getItem('adminUser');
    const adminName = sessionStorage.getItem('adminName');

    if (!adminUser) {
        window.location.href = 'admin-login.html';
    } else {
        document.getElementById('adminName').textContent = adminName || adminUser;
        loadApplications();
    }

    function logout() {
        sessionStorage.removeItem('adminUser');
        sessionStorage.removeItem('adminName');
        window.location.href = 'admin-login.html';
    }

    async function loadApplications() {
        try {
            const snapshot = await database.ref('applications').once('value');
            
            if (snapshot.exists()) {
                allApplications = [];
                snapshot.forEach((childSnapshot) => {
                    allApplications.push({
                        id: childSnapshot.key,
                        ...childSnapshot.val()
                    });
                });
                
                // Sort by date (newest first)
                allApplications.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));
                
                updateStats();
                displayApplications();
            } else {
                document.getElementById('noApplications').style.display = 'block';
            }
            
            document.getElementById('loading').style.display = 'none';
        } catch (error) {
            console.error('Error loading applications:', error);
            document.getElementById('loading').innerHTML = '<p style="color: var(--error);">حدث خطأ في تحميل البيانات</p>';
        }
    }

    function updateStats() {
        const pending = allApplications.filter(app => app.status === 'قيد المراجعة').length;
        const approved = allApplications.filter(app => app.status === 'مقبول').length;
        const rejected = allApplications.filter(app => app.status === 'مرفوض').length;

        document.getElementById('pendingCount').textContent = pending;
        document.getElementById('approvedCount').textContent = approved;
        document.getElementById('rejectedCount').textContent = rejected;
    }

    function filterApplications(filter) {
        currentFilter = filter;
        
        // Update active tab
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.classList.remove('active');
        });
        event.target.classList.add('active');
        
        displayApplications();
    }

    function displayApplications() {
        const container = document.getElementById('applicationsList');
        let filteredApps = allApplications;

        if (currentFilter !== 'all') {
            filteredApps = allApplications.filter(app => app.status === currentFilter);
        }

        if (filteredApps.length === 0) {
            container.innerHTML = '';
            document.getElementById('noApplications').style.display = 'block';
            return;
        }

        document.getElementById('noApplications').style.display = 'none';
        
        container.innerHTML = filteredApps.map(app => `
            <div class="application-card">
                <div class="app-header">
                    <div class="app-id">${app.applicationId}</div>
                    <div class="status-badge ${app.status === 'قيد المراجعة' ? 'pending' : app.status === 'مقبول' ? 'approved' : 'rejected'}">
                        ${app.status}
                    </div>
                </div>
                <div class="app-info">
                    <div class="info-item">
                        <span class="info-label">الاسم</span>
                        <span class="info-value">${app.personalInfo.fullName}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">المهنة</span>
                        <span class="info-value">${app.occupation.type}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">تاريخ التقديم</span>
                        <span class="info-value">${new Date(app.submittedAt).toLocaleString('ar-SA', {dateStyle: 'short', timeStyle: 'short'})}</span>
                    </div>
                </div>
                <button class="btn-view" onclick='viewApplication(${JSON.stringify(app).replace(/'/g, "&#39;")})'>
                    عرض التفاصيل الكاملة
                </button>
            </div>
        `).join('');
    }

    function viewApplication(app) {
        const modal = document.getElementById('detailsModal');
        const modalBody = document.getElementById('modalBody');

        let rankSection = '';
        if (app.occupation.type !== 'مواطن' && app.occupation.rank) {
            const positions = app.occupation.positions && app.occupation.positions.length > 0 
                ? app.occupation.positions.join(', ') 
                : 'لا يوجد';
            
            rankSection = `
                <div class="detail-item">
                    <div class="detail-label">الرتبة</div>
                    <div class="detail-value">${app.occupation.rank}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">المناصب الإدارية</div>
                    <div class="detail-value">${positions}</div>
                </div>
            `;
        }

        modalBody.innerHTML = `
            <div class="detail-section">
                <h3>معلومات الطلب</h3>
                <div class="detail-grid">
                    <div class="detail-item">
                        <div class="detail-label">رقم الطلب</div>
                        <div class="detail-value">${app.applicationId}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">الحالة</div>
                        <div class="detail-value">
                            <span class="status-badge ${app.status === 'قيد المراجعة' ? 'pending' : app.status === 'مقبول' ? 'approved' : 'rejected'}">
                                ${app.status}
                            </span>
                        </div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">تاريخ التقديم</div>
                        <div class="detail-value">${new Date(app.submittedAt).toLocaleString('ar-SA')}</div>
                    </div>
                </div>
            </div>

            <div class="detail-section">
                <h3>البيانات الشخصية</h3>
                <div class="detail-grid">
                    <div class="detail-item">
                        <div class="detail-label">الاسم الرباعي</div>
                        <div class="detail-value">${app.personalInfo.fullName}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">العمر</div>
                        <div class="detail-value">${app.personalInfo.age} سنة</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">اسم الحساب (اللعبة)</div>
                        <div class="detail-value">${app.personalInfo.gameName}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">اسم الحساب (ديسكورد)</div>
                        <div class="detail-value">${app.personalInfo.discordName}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">رقم الهوية الوطنية</div>
                        <div class="detail-value">${app.personalInfo.nationalId}</div>
                    </div>
                </div>
            </div>

            <div class="detail-section">
                <h3>معلومات المهنة</h3>
                <div class="detail-grid">
                    <div class="detail-item">
                        <div class="detail-label">المهنة</div>
                        <div class="detail-value">${app.occupation.type}</div>
                    </div>
                    ${rankSection}
                </div>
            </div>

            <div class="detail-section">
                <h3>المستندات المرفقة</h3>
                <div style="display: grid; gap: 20px;">
                    <div>
                        <div class="detail-label" style="margin-bottom: 10px;">صورة الهوية (اللعبة)</div>
                        <img src="${app.documents.idImageGame}" class="image-preview" alt="صورة الهوية" onclick="window.open(this.src)">
                    </div>
                    <div>
                        <div class="detail-label" style="margin-bottom: 10px;">الصورة الشخصية</div>
                        <img src="${app.documents.personalPhoto}" class="image-preview" alt="الصورة الشخصية" onclick="window.open(this.src)">
                    </div>
                    ${app.documents.discordRanks ? `
                    <div>
                        <div class="detail-label" style="margin-bottom: 10px;">صورة الرتب (ديسكورد)</div>
                        <img src="${app.documents.discordRanks}" class="image-preview" alt="صورة الرتب" onclick="window.open(this.src)">
                    </div>
                    ` : ''}
                </div>
            </div>

            ${app.status === 'قيد المراجعة' ? `
            <div class="action-buttons">
                <button class="btn-action btn-approve" onclick="updateApplicationStatus('${app.applicationId}', 'مقبول')">
                    ✓ قبول الطلب
                </button>
                <button class="btn-action btn-reject" onclick="updateApplicationStatus('${app.applicationId}', 'مرفوض')">
                    ✗ رفض الطلب
                </button>
            </div>
            ` : ''}
        `;

        modal.classList.add('show');
    }

    function closeModal() {
        document.getElementById('detailsModal').classList.remove('show');
    }

    async function updateApplicationStatus(applicationId, newStatus) {
        if (confirm(`هل أنت متأكد من ${newStatus === 'مقبول' ? 'قبول' : 'رفض'} هذا الطلب؟`)) {
            try {
                await database.ref(`applications/${applicationId}/status`).set(newStatus);
                await database.ref(`applications/${applicationId}/reviewedAt`).set(new Date().toISOString());
                await database.ref(`applications/${applicationId}/reviewedBy`).set(adminUser);
                
                alert(`تم ${newStatus === 'مقبول' ? 'قبول' : 'رفض'} الطلب بنجاح`);
                closeModal();
                loadApplications();
            } catch (error) {
                console.error('Error updating status:', error);
                alert('حدث خطأ أثناء تحديث الحالة');
            }
        }
    }

    // Close modal when clicking outside
    document.getElementById('detailsModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeModal();
        }
    });
</script>
