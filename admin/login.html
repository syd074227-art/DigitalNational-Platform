<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الإدارة - منصة KR</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-blue: #1e40af;
            --primary-dark: #0f172a;
            --primary-light: #3b82f6;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.2);
            animation: fadeIn 0.8s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            color: white;
            margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }
        
        .logo-section h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        
        .logo-section p {
            color: #94a3b8;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #e2e8f0;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Tajawal', sans-serif;
            margin-top: 10px;
        }
        
        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }
        
        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .alert {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
        }
        
        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
        
        .spinner {
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #60a5fa;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        
        .back-link a:hover {
            color: #3b82f6;
            text-decoration: underline;
        }
        
        .security-note {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(59, 130, 246, 0.2);
        }
        
        .floating-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
            font-weight: 500;
            z-index: 10000;
            animation: slideInRight 0.5s ease;
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .eye-toggle {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
        }
        
        .password-wrapper {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo">KR</div>
            <h1>لوحة تحكم الإدارة</h1>
            <p>تسجيل دخول المسؤولين</p>
        </div>
        
        <div id="alertMessage" class="alert" style="display: none;"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="admin@kr.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="********" required>
                    <button type="button" class="eye-toggle" onclick="togglePassword()">👁️</button>
                </div>
            </div>
            
            <div class="loading" id="loadingSpinner">
                <div class="spinner"></div>
                <p>جاري التحقق...</p>
            </div>
            
            <button type="submit" class="btn-login" id="loginBtn">
                تسجيل الدخول
            </button>
        </form>
        
        <div class="back-link">
            <a href="index.html">← العودة للصفحة الرئيسية</a>
        </div>
        
        <div class="security-note">
            ⚡ نظام دخول آمن ومشفّر
        </div>
    </div>

    <script>
        // تهيئة Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyC17Jg6PLB2g8-J5IGBihqj_hb9lSLkraM",
            authDomain: "kr-system-5c846.firebaseapp.com",
            databaseURL: "https://kr-system-5c846-default-rtdb.firebaseio.com",
            projectId: "kr-system-5c846",
            storageBucket: "kr-system-5c846.appspot.com",
            messagingSenderId: "420668677876",
            appId: "1:420668677876:web:35e59b7b1da4c3ec171f15"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // عرض التنبيهات
        function showAlert(message, type = 'error') {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.style.display = 'none';
                }, 3000);
            }
        }

        // عرض تنبيه عائم
        function showFloatingNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'floating-notification';
            notification.textContent = message;
            notification.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: linear-gradient(135deg, #3b82f6, #1d4ed8);
                color: white;
                padding: 12px 20px;
                border-radius: 10px;
                box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
                font-weight: 500;
                z-index: 10000;
                animation: slideInRight 0.5s ease;
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideInRight 0.5s ease reverse forwards';
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 500);
            }, 3000);
        }

        // تبديل رؤية كلمة المرور
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.eye-toggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '👁️‍🗨️';
                showFloatingNotification('يمكنك الآن رؤية كلمة المرور');
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
                showFloatingNotification('تم إخفاء كلمة المرور');
            }
        }

        // تسجيل الدخول
        async function loginUser(email, password) {
            try {
                // التحقق من البريد الإلكتروني الإداري
                if (!email.includes('@admin.kr') && !email.includes('admin@')) {
                    showAlert('البريد الإلكتروني غير مصرح به للوصول الإداري', 'error');
                    return false;
                }

                // تسجيل الدخول باستخدام Firebase Auth
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // التحقق من صلاحيات المستخدم في قاعدة البيانات
                const userRef = database.ref('users/' + user.uid);
                const snapshot = await userRef.once('value');
                const userData = snapshot.val();
                
                if (!userData || userData.role !== 'admin') {
                    await auth.signOut();
                    showAlert('ليس لديك صلاحيات إدارية', 'error');
                    return false;
                }
                
                // حفظ بيانات الجلسة
                localStorage.setItem('adminToken', user.uid);
                localStorage.setItem('adminEmail', email);
                localStorage.setItem('adminRole', userData.role);
                
                showAlert('تم تسجيل الدخول بنجاح!', 'success');
                showFloatingNotification('مرحباً بك في لوحة التحكم');
                
                // تسجيل عملية الدخول
                await database.ref('adminLogs').push({
                    adminId: user.uid,
                    email: email,
                    action: 'login',
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    ip: await getClientIP()
                });
                
                // الانتقال للوحة التحكم بعد 2 ثانية
                setTimeout(() => {
                    window.location.href = 'admin/dashboard.html';
                }, 2000);
                
                return true;
                
            } catch (error) {
                console.error('Login error:', error);
                
                // تحديد نوع الخطأ وعرض رسالة مناسبة
                let errorMessage = 'حدث خطأ أثناء تسجيل الدخول';
                
                switch (error.code) {
                    case 'auth/user-not-found':
                        errorMessage = 'المستخدم غير موجود';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = 'كلمة المرور غير صحيحة';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'بريد إلكتروني غير صالح';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = 'تم تجاوز عدد المحاولات. يرجى المحاولة لاحقاً';
                        break;
                }
                
                showAlert(errorMessage, 'error');
                return false;
            }
        }

        // الحصول على IP العميل
        async function getClientIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch {
                return 'unknown';
            }
        }

        // التحقق من صحة البريد الإلكتروني
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        // إرسال النموذج
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // التحقق من الحقول
            if (!email || !password) {
                showAlert('يرجى تعبئة جميع الحقول', 'error');
                return;
            }
            
            if (!validateEmail(email)) {
                showAlert('يرجى إدخال بريد إلكتروني صالح', 'error');
                return;
            }
            
            if (password.length < 6) {
                showAlert('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
                return;
            }
            
            // إظهار حالة التحميل
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('loginBtn').disabled = true;
            
            try {
                await loginUser(email, password);
            } finally {
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('loginBtn').disabled = false;
            }
        });

        // إضافة تأثيرات للبيانات
        document.addEventListener('DOMContentLoaded', function() {
            // إضافة تأثيرات لحقول الإدخال
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.style.transform = 'scale(1.02)';
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.style.transform = 'scale(1)';
                });
            });
            
            // إضافة تأثير للزر
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.addEventListener('mouseenter', function() {
                if (!this.disabled) {
                    this.style.transform = 'translateY(-2px)';
                    this.style.boxShadow = '0 10px 25px rgba(59, 130, 246, 0.4)';
                }
            });
            
            loginBtn.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0)';
                this.style.boxShadow = 'none';
            });
            
            // عرض رسالة ترحيب
            setTimeout(() => {
                showFloatingNotification('مرحباً بك في نظام إدارة منصة KR');
            }, 1000);
            
            // محاولة تسجيل الدخول التلقائي إذا كان هناك token
            const adminToken = localStorage.getItem('adminToken');
            if (adminToken) {
                showAlert('يتم التحقق من بيانات الجلسة...', 'info');
                
                setTimeout(() => {
                    window.location.href = 'admin/dashboard.html';
                }, 1000);
            }
        });

        // منع النسخ واللصق في كلمة المرور
        document.getElementById('password').addEventListener('copy', function(e) {
            e.preventDefault();
            showAlert('لا يسمح بنسخ كلمة المرور', 'warning');
        });
        
        document.getElementById('password').addEventListener('paste', function(e) {
            e.preventDefault();
            showAlert('لا يسمح بلصق كلمة المرور', 'warning');
        });
    </script>
</body>
</html>
