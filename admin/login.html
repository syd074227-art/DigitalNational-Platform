<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول الإداري - الهيئة الرقمية KR</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-gold: #d4af37;
            --primary-dark: #0a1929;
            --text-light: #ffffff;
            --text-secondary: #94a3b8;
            --error: #ef4444;
        }
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
            animation: pulse 10s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 450px;
            margin: 20px;
        }
        .login-box {
            background: linear-gradient(135deg, rgba(26, 43, 61, 0.9), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 25px;
            padding: 50px 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 100px rgba(212, 175, 55, 0.1);
            animation: fadeInUp 0.8s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }
        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--primary-gold), #f4e5b8);
            border-radius: 25px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Tajawal', sans-serif;
            font-size: 48px;
            font-weight: 900;
            color: var(--primary-dark);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.4);
            margin-bottom: 20px;
            animation: logoGlow 3s ease-in-out infinite;
        }
        @keyframes logoGlow {
            0%, 100% { box-shadow: 0 15px 40px rgba(212, 175, 55, 0.4); }
            50% { box-shadow: 0 20px 50px rgba(212, 175, 55, 0.6); transform: scale(1.05); }
        }
        .login-title {
            font-family: 'Tajawal', sans-serif;
            font-size: 28px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary-gold), #f4e5b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 35px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-light);
            font-weight: 500;
            font-size: 14px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            color: var(--text-light);
            font-size: 15px;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
            background: rgba(15, 23, 42, 0.8);
        }
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary-gold), #f4e5b8);
            border: none;
            border-radius: 12px;
            color: var(--primary-dark);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Tajawal', sans-serif;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
            margin-top: 10px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.4);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            color: #fca5a5;
            font-size: 14px;
            display: none;
            text-align: center;
        }
        .error-message.show {
            display: block;
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .back-link {
            text-align: center;
            margin-top: 25px;
        }
        .back-link a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }
        .back-link a:hover {
            color: var(--primary-gold);
        }
        .security-badge {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }
        .security-badge p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 8px;
        }
        .security-badge .icon {
            font-size: 20px;
            margin-left: 5px;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            border: 3px solid rgba(212, 175, 55, 0.3);
            border-top: 3px solid var(--primary-gold);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo-container">
                <div class="logo">KR</div>
                <h2 class="login-title">الدخول الإداري</h2>
                <p class="login-subtitle">نظام إدارة الطلبات - الهيئة الرقمية</p>
            </div>

        <div class="back-link">

        <div class="security-badge">

    </div>
</div>

<script>
    // Firebase Configuration
    const firebaseConfig = {
        databaseURL: "https://kr-system-5c846-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');
        const loading = document.getElementById('loading');

        // Hide error message
        errorMsg.classList.remove('show');
        loginBtn.style.display = 'none';
        loading.classList.add('show');

        try {
            // Check credentials in Firebase
            const adminRef = database.ref('admins/' + username);
            const snapshot = await adminRef.once('value');
            
            if (snapshot.exists()) {
                const adminData = snapshot.val();
                if (adminData.password === password) {
                    // Success - store session
                    sessionStorage.setItem('adminUser', username);
                    sessionStorage.setItem('adminName', adminData.name);
                    
                    // Redirect to admin panel
                    window.location.href = 'admin-dashboard.html';
                } else {
                    showError('كلمة المرور غير صحيحة');
                }
            } else {
                showError('اسم المستخدم غير موجود');
            }
        } catch (error) {
            console.error('Login error:', error);
            showError('حدث خطأ في الاتصال، يرجى المحاولة مرة أخرى');
        }

        loading.classList.remove('show');
        loginBtn.style.display = 'block';
    });

    function showError(message) {
        const errorMsg = document.getElementById('errorMessage');
        errorMsg.textContent = message;
        errorMsg.classList.add('show');
    }
