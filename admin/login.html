<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إداري | تسجيل الدخول</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a237e;
            --primary-dark: #0d1b48;
            --accent: #ffab00;
            --accent-dark: #ff8f00;
            --success: #00c853;
            --danger: #d32f2f;
            --dark: #0a0e1a;
            --light: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-icon {
            font-size: 60px;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .login-header h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 171, 0, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .login-btn {
            width: 100%;
            padding: 17px;
            background: var(--accent);
            color: var(--dark);
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: var(--accent-dark);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 171, 0, 0.3);
        }

        .error-message {
            background: rgba(211, 47, 47, 0.2);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            border: 1px solid rgba(211, 47, 47, 0.3);
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h1>لوحة تحكم KR</h1>
                <p>النظام الإداري - تسجيل دخول المدير</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم">
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور">
            </div>

            <button class="login-btn" onclick="login()">
                <span id="btnText">تسجيل الدخول</span>
                <div class="loading-spinner" id="loadingSpinner"></div>
                <i class="fas fa-sign-in-alt" id="btnIcon"></i>
            </button>
        </div>
    </div>

    <script>
        // بيانات المديرين المعتمدة
        const ADMIN_CREDENTIALS = {
            "admin": "KR@2024",
            "مدير": "123456",
            "administrator": "Admin@2024",
            "supervisor": "Super@2024"
        };

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showLoading(show) {
            const btnText = document.getElementById('btnText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const btnIcon = document.getElementById('btnIcon');
            
            if (show) {
                btnText.textContent = 'جاري التحقق...';
                loadingSpinner.style.display = 'block';
                btnIcon.style.display = 'none';
            } else {
                btnText.textContent = 'تسجيل الدخول';
                loadingSpinner.style.display = 'none';
                btnIcon.style.display = 'inline-block';
            }
        }

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showError('يرجى ملء جميع الحقول');
                return;
            }
            
            showLoading(true);
            
            // محاكاة تأخير الشبكة
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            // التحقق من بيانات الدخول
            if (ADMIN_CREDENTIALS[username] === password) {
                // حفظ بيانات الجلسة
                const sessionData = {
                    username: username,
                    loginTime: new Date().toISOString(),
                    sessionId: 'KR_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9)
                };
                
                localStorage.setItem('kr_admin_session', JSON.stringify(sessionData));
                
                // رسالة نجاح
                document.querySelector('.login-btn').style.background = 'var(--success)';
                document.getElementById('btnText').textContent = 'تم الدخول بنجاح!';
                
                // الانتقال للوحة التحكم بعد 1.5 ثانية
                setTimeout(() => {
                    window.location.href = 'panel.html';
                }, 1500);
                
            } else {
                showLoading(false);
                showError('اسم المستخدم أو كلمة المرور غير صحيحة');
                
                // تأثير اهتزاز للحقول
                const inputs = document.querySelectorAll('input');
                inputs.forEach(input => {
                    input.style.borderColor = 'var(--danger)';
                    input.style.animation = 'shake 0.5s';
                    
                    setTimeout(() => {
                        input.style.animation = '';
                        input.style.borderColor = '';
                    }, 500);
                });
            }
        }

        // تفعيل الدخول بالإنتر
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });

        // إضافة تأثير الاهتزاز
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);

        // التحقق من وجود جلسة نشطة
        window.onload = function() {
            const session = localStorage.getItem('kr_admin_session');
            if (session) {
                try {
                    const sessionData = JSON.parse(session);
                    const loginTime = new Date(sessionData.loginTime);
                    const now = new Date();
                    const diffHours = (now - loginTime) / (1000 * 60 * 60);
                    
                    // إذا مرت أقل من 8 ساعات، انتقل مباشرة للوحة التحكم
                    if (diffHours < 8) {
                        window.location.href = 'panel.html';
                    } else {
                        // حذف الجلسة المنتهية
                        localStorage.removeItem('kr_admin_session');
                    }
                } catch (e) {
                    localStorage.removeItem('kr_admin_session');
                }
            }
        };
    </script>
</body>
</html>
